server:
  listen_address: "0.0.0.0:8002"

apiserver:
  master: ""
  kubeconfig: "/opt/ingate/admin/configs/kubeconfig.yaml"

mysql:
  dsn: "ingate:ingate@tcp(mysql:3306)/ingate?charset=utf8mb4&parseTime=true&loc=UTC&timeout=5s&readTimeout=5s&writeTimeout=5s"
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: "30m"

redis:
  address: "redis:6379"
  password: ""
  database: 0

logging:
  format: "json"
  level: "info"
  add_source: false
  stdout: true
  file:
    path: ""
    max_size_mb: 0
    max_backups: 0
    max_age_days: 0
    compress: false
    local_time: false
