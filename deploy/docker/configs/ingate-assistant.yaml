server:
  http:
    addr: "0.0.0.0:8003"
    timeout: "5s"
  shutdown_timeout: "30s"

data:
  mysql:
    address: "mysql:3306"
    database: "ingate"
    username: "ingate"
    password: "${MYSQL_PASSWORD}"
    dial_timeout: "5s"
    max_open_connections: 20
    max_idle_connections: 10
    connection_max_lifetime: "1800s"
  redis:
    address: "redis:6379"
    password: ""
    database: 0
    dial_timeout: "3s"
    read_timeout: "20s"
    write_timeout: "3s"
    pool_size: 20

model:
  base_url: "${ASSISTANT_MODEL_BASE_URL:}"
  api_key: "${ASSISTANT_MODEL_API_KEY:}"
  name: "${ASSISTANT_MODEL_NAME:}"
  timeout: "120s"
  max_output_tokens: 4096
  max_iterations: 8
  instruction: "你是 Ingate 运维助手。回答必须基于可验证的系统事实；需要变更时先说明影响并等待用户确认。"

stream:
  retention: "86400s"
  max_events: 2000
  read_block: "15s"

logging:
  format: "json"
  level: "info"
  add_source: false
