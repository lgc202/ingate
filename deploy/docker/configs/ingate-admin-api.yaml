server:
  http:
    addr: "0.0.0.0:8002"
    timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "/opt/ingate/admin-api/configs/kubeconfig.yaml"
  mysql:
    dsn: "ingate:ingate@tcp(mysql:3306)/ingate?charset=utf8mb4&parseTime=true&loc=UTC&timeout=5s&readTimeout=5s&writeTimeout=5s"
    max_open_connections: 20
    max_idle_connections: 10
    connection_max_lifetime: "1800s"
  redis:
    address: "redis:6379"
    password: ""
    database: 0

logging:
  format: "json"
  level: "info"
  add_source: false

authentication:
  enabled: false
  issuer: ""
  audience: "ingate-console"
  client_id: "ingate-console"
  scopes: ["openid", "profile", "email"]
  roles_claim: "roles"
  admin_roles: ["ingate-admin"]
  operator_roles: ["ingate-operator"]
  viewer_roles: ["ingate-viewer"]
  discovery_timeout: "10s"
