server:
  http:
    addr: "0.0.0.0:8002"
    timeout: "30s"
  shutdown_timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "/opt/ingate/admin-api/configs/kubeconfig.yaml"
  analytics:
    addr: "analytics:18101"
    timeout: "5s"
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
logging:
  format: "json"
  level: "info"
  add_source: false

authentication:
  enabled: false
  issuer: ""
  audience: "ingate-console"
  client_id: "ingate-console"
  scopes: ["openid", "profile", "email"]
  roles_claim: "roles"
  admin_roles: ["ingate-admin"]
  operator_roles: ["ingate-operator"]
  viewer_roles: ["ingate-viewer"]
  discovery_timeout: "10s"
