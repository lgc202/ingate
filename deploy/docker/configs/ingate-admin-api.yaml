server:
  http:
    addr: "0.0.0.0:8002"
    timeout: "30s"
  grpc:
    addr: "0.0.0.0:18083"
    timeout: "30s"
  shutdown_timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "/opt/ingate/admin-api/configs/kubeconfig.yaml"
    bearer_token: "${APISERVER_BEARER_TOKEN}"
  analytics:
    addr: "analytics:18101"
    timeout: "5s"
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
  ai_ext_proc:
    addr: "controller:18081"
    timeout: "2s"
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
  plugin_catalog:
    official_source_url: "https://lgc202.github.io/ingate/plugins/v1/catalog.json"
    refresh_interval: "3600s"
    timeout: "5s"
logging:
  format: "json"
  level: "info"
  add_source: false
