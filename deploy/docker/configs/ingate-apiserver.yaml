server:
  bind_address: "0.0.0.0"
  secure_port: 18443
  cert_directory: "/opt/ingate/apiserver/certificates"

storage:
  etcd_servers:
    - "http://etcd:2379"
  path_prefix: "/registry/gateway.ingate.io"

logging:
  format: "json"
  level: "info"
  add_source: false
  stdout: true
  file:
    path: ""
    max_size_mb: 0
    max_backups: 0
    max_age_days: 0
    compress: false
    local_time: false
