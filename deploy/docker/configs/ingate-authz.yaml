server:
  grpc:
    addr: "127.0.0.1:18071"
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      client_ca_file: ""
  http:
    addr: "127.0.0.1:18072"
    timeout: "5s"
  shutdown_timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "/opt/ingate/authz/configs/kubeconfig.yaml"
    bearer_token: "${APISERVER_BEARER_TOKEN}"
  redis:
    address: "redis:6379"
    password: ""
    database: 0
    dial_timeout: "2s"
    operation_timeout: "1s"

logging:
  format: "json"
  level: "info"
  add_source: false
