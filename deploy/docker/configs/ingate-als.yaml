server:
  grpc:
    addr: "127.0.0.1:18091"
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      client_ca_file: ""
  http:
    # 指标端口只在 Compose 内部网络可达，不映射到宿主机。
    addr: "0.0.0.0:18092"
    timeout: "5s"
  shutdown_timeout: "30s"

data:
  reliability_mode: "DEVELOPMENT"
  kafka:
    brokers: ["kafka:9092"]
    topic: "ingate.request-records"
    write_timeout: "5s"
    dial_timeout: "5s"
    topic_check_timeout: "2s"
    sasl:
      mechanism: ""
      username: ""
      password: ""
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
  disk_queue:
    path: "/data/ingate/als/queue"
    segment_bytes: 20971520
    capacity_bytes: 1073741824
    min_free_bytes: 1073741824
    replay_batch_size: 500
    replay_min_backoff: "0.5s"
    replay_max_backoff: "30s"
    sync: true

logging:
  format: "json"
  level: "info"
  add_source: false

telemetry:
  environment: "development"
  tracing:
    endpoint: "${ALS_TRACING_ENDPOINT:}"
    insecure: true
    sample_ratio: 1.0
    max_queue_size: 2048
    export_batch_size: 256
    batch_timeout: "2s"
    export_timeout: "5s"
    tls:
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
