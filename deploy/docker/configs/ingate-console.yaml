server:
  http:
    addr: "0.0.0.0:8001"
    timeout: "30s"
  console_dir: "/opt/ingate/console/web"
  shutdown_timeout: "30s"
  authentication:
    enabled: true
    username: "admin"
    password: "${ADMIN_PASSWORD}"
    session_secret: "${SESSION_SECRET}"
    session_ttl: "43200s"
    secure_cookie: false

data:
  admin_api:
    base_url: "http://admin-api:8002"
  assistant:
    base_url: "http://assistant:8003"

logging:
  format: "json"
  level: "info"
  add_source: false
