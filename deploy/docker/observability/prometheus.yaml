global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: ingate-als
    static_configs:
      # ALS 与 Controller 共享网络命名空间，Controller 的服务名可稳定访问其内部指标端口。
      - targets: ["controller:18092"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
