name: ${COMPOSE_PROJECT_NAME:-ingate}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=ingate-etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=ingate-etcd=http://etcd:2380
      - --data-dir=/var/lib/etcd
    healthcheck:
      test:
        - CMD
        - etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      ingate:
        aliases:
          - etcd

  apiserver:
    build:
      context: ../..
      dockerfile: build/package/apiserver.Dockerfile
    image: ingate/apiserver:dev
    depends_on:
      etcd:
        condition: service_healthy
    command:
      - --etcd-servers=http://etcd:2379
      - --bind-address=0.0.0.0
      - --secure-port=18443
      - --cert-dir=/var/lib/ingate/certs
      - --auth-admin-token=${APISERVER_ADMIN_TOKEN:-ingate-dev-admin-token}
    ports:
      - "${APISERVER_PORT:-18443}:18443"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --noproxy '*' -kfsS https://127.0.0.1:18443/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      ingate:
        aliases:
          - apiserver

  controller-manager:
    build:
      context: ../..
      dockerfile: build/package/controller-manager.Dockerfile
    image: ingate/controller-manager:dev
    depends_on:
      apiserver:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed \
          -e "s|__APISERVER_ADDRESS__|https://apiserver:18443|g" \
          -e "s|__APISERVER_ADMIN_TOKEN__|$${APISERVER_ADMIN_TOKEN}|g" \
          /etc/ingate/apiserver.kubeconfig.tmpl > /tmp/apiserver.kubeconfig
        exec /usr/local/bin/ingate-controller-manager \
          --apiserver-address=https://apiserver:18443 \
          --kubeconfig=/tmp/apiserver.kubeconfig \
          --metrics-bind-address=0.0.0.0:18080 \
          --healthz-bind-address=0.0.0.0:18081
    environment:
      APISERVER_ADMIN_TOKEN: ${APISERVER_ADMIN_TOKEN:-ingate-dev-admin-token}
    volumes:
      - ./config/apiserver.kubeconfig:/etc/ingate/apiserver.kubeconfig.tmpl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --noproxy '*' -fsS http://127.0.0.1:18081/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      ingate:
        aliases:
          - controller-manager

  xds-server:
    build:
      context: ../..
      dockerfile: build/package/xds-server.Dockerfile
    image: ingate/xds-server:dev
    depends_on:
      apiserver:
        condition: service_healthy
      controller-manager:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed \
          -e "s|__APISERVER_ADDRESS__|https://apiserver:18443|g" \
          -e "s|__APISERVER_ADMIN_TOKEN__|$${APISERVER_ADMIN_TOKEN}|g" \
          /etc/ingate/apiserver.kubeconfig.tmpl > /tmp/apiserver.kubeconfig
        exec /usr/local/bin/ingate-xds-server \
          --apiserver-address=https://apiserver:18443 \
          --kubeconfig=/tmp/apiserver.kubeconfig \
          --grpc-bind-address=0.0.0.0:19090 \
          --healthz-bind-address=0.0.0.0:19091
    environment:
      APISERVER_ADMIN_TOKEN: ${APISERVER_ADMIN_TOKEN:-ingate-dev-admin-token}
    volumes:
      - ./config/apiserver.kubeconfig:/etc/ingate/apiserver.kubeconfig.tmpl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --noproxy '*' -fsS http://127.0.0.1:19091/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    ports:
      - "${XDS_SERVER_GRPC_PORT:-19090}:19090"
    networks:
      ingate:
        aliases:
          - xds-server

  admin-api:
    build:
      context: ../..
      dockerfile: build/package/admin-api.Dockerfile
    image: ingate/admin-api:dev
    depends_on:
      apiserver:
        condition: service_healthy
    command:
      - --bind-address=0.0.0.0
      - --port=18080
      - --apiserver-address=https://apiserver:18443
      - --apiserver-token=${APISERVER_ADMIN_TOKEN:-ingate-dev-admin-token}
      - --apiserver-insecure-skip-tls-verify=true
      - --admin-token=${ADMIN_API_TOKEN:-ingate-dev-admin-api-token}
    ports:
      - "${ADMIN_API_PORT:-18080}:18080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --noproxy '*' -fsS http://127.0.0.1:18080/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      ingate:
        aliases:
          - admin-api

  console:
    build:
      context: ../..
      dockerfile: build/package/console.Dockerfile
    image: ingate/console:dev
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-8088}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      ingate:
        aliases:
          - console

  sample-backend:
    build:
      context: ../..
      dockerfile: build/package/sample-backend.Dockerfile
    image: ingate/sample-backend:dev
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      ingate:
        ipv4_address: ${SAMPLE_BACKEND_ADDRESS:-172.31.250.10}
        aliases:
          - sample-backend

  init-control-plane:
    image: curlimages/curl:8.16.0
    depends_on:
      apiserver:
        condition: service_healthy
      controller-manager:
        condition: service_healthy
      xds-server:
        condition: service_healthy
      sample-backend:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /init/seed.sh
    environment:
      APISERVER_ADDRESS: https://apiserver:18443
      APISERVER_TOKEN: ${APISERVER_ADMIN_TOKEN:-ingate-dev-admin-token}
      CONTROLLER_MANAGER_HEALTH_URL: http://controller-manager:18081/healthz
      XDS_SERVER_HEALTH_URL: http://xds-server:19091/healthz
      GATEWAY_NAME: ${GATEWAY_NAME:-compose-gateway}
      ROUTE_NAME: ${ROUTE_NAME:-compose-orders-route}
      BACKEND_NAME: ${BACKEND_NAME:-compose-backend}
      GATEWAY_HOST: ${GATEWAY_HOST:-api.example.com}
      ROUTE_PATH_PREFIX: ${ROUTE_PATH_PREFIX:-/orders}
      BACKEND_ENDPOINT_ADDRESS: ${BACKEND_ENDPOINT_ADDRESS:-172.31.250.10}
      BACKEND_ENDPOINT_PORT: ${BACKEND_ENDPOINT_PORT:-8080}
      BACKEND_PROTOCOL: ${BACKEND_PROTOCOL:-HTTP}
    volumes:
      - ./init/seed.sh:/init/seed.sh:ro
    restart: "no"
    networks:
      ingate:
        aliases:
          - init-control-plane

  envoy:
    image: envoyproxy/envoy:v1.32.4
    depends_on:
      xds-server:
        condition: service_healthy
      init-control-plane:
        condition: service_completed_successfully
    command:
      - -c
      - /etc/envoy/envoy.yaml
      - --service-node
      - compose-gateway
      - --service-cluster
      - ingate-compose
    ports:
      - "${ENVOY_PROXY_PORT:-10080}:80"
      - "${ENVOY_ADMIN_PORT:-19901}:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      ingate:
        aliases:
          - envoy

networks:
  ingate:
    name: ${COMPOSE_PROJECT_NAME:-ingate}-network
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.250.0/24}
