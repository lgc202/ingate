name: ingate

x-ingate-build: &ingate-build
  context: .
  dockerfile: deploy/docker/ingate-compose.Dockerfile

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/var/lib/etcd
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.9-bookworm
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./deploy/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:4.0.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.0.2
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic ingate.request-records
        --partitions 3
        --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse:25.8.28.1
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ingate
      CLICKHOUSE_USER: ingate
      CLICKHOUSE_PASSWORD: ingate-dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "ingate", "--password", "ingate-dev", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  als:
    image: ingate/als:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: als
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/docker/configs/ingate-als.yaml:/opt/ingate/als/configs/config.yaml:ro
      - als-data:/data/ingate/als
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18092/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  analytics-migrate:
    image: ingate/analytics:${INGATE_IMAGE_TAG:-dev}
    build:
      <<: *ingate-build
      target: analytics
    command: ["--config", "/opt/ingate/analytics/configs/config.yaml", "--migrate"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./deploy/docker/configs/ingate-analytics.yaml:/opt/ingate/analytics/configs/config.yaml:ro
    restart: "no"

  analytics:
    image: ingate/analytics:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: analytics
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      analytics-migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/docker/configs/ingate-analytics.yaml:/opt/ingate/analytics/configs/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18102/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  apiserver:
    image: ingate/apiserver:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: apiserver
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./deploy/docker/configs/ingate-apiserver.yaml:/opt/ingate/apiserver/configs/config.yaml:ro
      - apiserver-certificates:/opt/ingate/apiserver/certificates
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:18443/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  controller:
    image: ingate/controller:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: controller
    depends_on:
      apiserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INGATE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${INGATE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/docker/configs/ingate-controller.yaml:/opt/ingate/controller/configs/config.yaml:ro
      - ./deploy/docker/kubeconfig.yaml:/opt/ingate/controller/configs/kubeconfig.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  envoy:
    image: envoyproxy/envoy:v1.39.0
    restart: unless-stopped
    network_mode: service:controller
    volumes:
      - ./deploy/docker/envoy-bootstrap.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      controller:
        condition: service_healthy
      als:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/15000; printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  admin-api:
    image: ingate/admin-api:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: admin-api
    depends_on:
      apiserver:
        condition: service_healthy
      analytics:
        condition: service_healthy
    volumes:
      - ./deploy/docker/configs/ingate-admin-api.yaml:/opt/ingate/admin-api/configs/config.yaml:ro
      - ./deploy/docker/kubeconfig.yaml:/opt/ingate/admin-api/configs/kubeconfig.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  console:
    image: ingate/console:${INGATE_IMAGE_TAG:-dev}
    restart: unless-stopped
    build:
      <<: *ingate-build
      target: console
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INGATE_CONSOLE_PORT:-8001}:8001"
    volumes:
      - ./deploy/docker/configs/ingate-console.yaml:/opt/ingate/console/configs/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  als-data:
  apiserver-certificates:
  clickhouse-data:
  etcd-data:
  kafka-data:
  redis-data:
