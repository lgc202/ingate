name: ingate

services:
  etcd:
    image: registry.k8s.io/etcd:3.6.4-0
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/var/lib/etcd
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.9-bookworm
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/redis.conf:/usr/local/etc/redis/redis.conf:ro"
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ingate
      MYSQL_USER: ingate
      MYSQL_PASSWORD: "${INGATE_MYSQL_PASSWORD:-ingate-dev}"
      MYSQL_ROOT_PASSWORD: "${INGATE_MYSQL_ROOT_PASSWORD:-ingate-root-dev}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-schema:
    image: temporalio/admin-tools:1.31.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: "${INGATE_MYSQL_ROOT_PASSWORD:-ingate-root-dev}"
      MYSQL_SEEDS: mysql
      SQL_PASSWORD: "${INGATE_MYSQL_ROOT_PASSWORD:-ingate-root-dev}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/temporal/setup-mysql.sh:/scripts/setup-mysql.sh:ro"
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-mysql.sh
    restart: "no"

  temporal:
    image: temporalio/server:1.31.0
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: "${INGATE_MYSQL_ROOT_PASSWORD:-ingate-root-dev}"
      MYSQL_SEEDS: mysql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ingate
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro"
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    restart: "no"

  kafka:
    image: apache/kafka:4.0.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.0.2
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic ingate.request-records
        --partitions 3
        --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  clickhouse:
    # Analytics 依赖该版本对异步写入 token 分区去重和部分重投的修复
    image: clickhouse:26.7.3.19
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ingate
      CLICKHOUSE_USER: ingate
      CLICKHOUSE_PASSWORD: "${INGATE_CLICKHOUSE_PASSWORD:-ingate-dev}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ingate --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  als:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-als:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    # Envoy 与 ALS 共享网络命名空间，避免请求记录经过容器网络传输
    network_mode: service:controller
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-als.yaml:/opt/ingate/als/configs/config.yaml:ro"
      - als-data:/data/ingate/als
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18092/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  analytics-migrate:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-analytics:${INGATE_VERSION:-latest}"
    command: ["--config", "/opt/ingate/analytics/configs/config.yaml", "--migrate"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      INGATE_CLICKHOUSE_PASSWORD: "${INGATE_CLICKHOUSE_PASSWORD:-ingate-dev}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-analytics.yaml:/opt/ingate/analytics/configs/config.yaml:ro"
    restart: "no"

  analytics:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-analytics:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      analytics-migrate:
        condition: service_completed_successfully
    environment:
      INGATE_CLICKHOUSE_PASSWORD: "${INGATE_CLICKHOUSE_PASSWORD:-ingate-dev}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-analytics.yaml:/opt/ingate/analytics/configs/config.yaml:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18102/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ai-extproc:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-ai-extproc:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    # 入口流保存的原始请求必须与同一请求的上游重试流落在同一个进程
    # Compose 让 AI ExtProc 与 Envoy 共享网络命名空间，生产部署应保持一对一伴生关系
    network_mode: service:controller
    depends_on:
      apiserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INGATE_APISERVER_BEARER_TOKEN: "${INGATE_APISERVER_BEARER_TOKEN:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-ai-extproc.yaml:/opt/ingate/ai-extproc/configs/config.yaml:ro"
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/kubeconfig.yaml:/opt/ingate/ai-extproc/configs/kubeconfig.yaml:ro"
      - apiserver-certificates:/opt/ingate/apiserver-client:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  authz:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-authz:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    # Envoy 与 Authz 共享网络命名空间，避免调用方凭据经过容器网络传输
    network_mode: service:controller
    depends_on:
      apiserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INGATE_APISERVER_BEARER_TOKEN: "${INGATE_APISERVER_BEARER_TOKEN:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-authz.yaml:/opt/ingate/authz/configs/config.yaml:ro"
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/kubeconfig.yaml:/opt/ingate/authz/configs/kubeconfig.yaml:ro"
      - apiserver-certificates:/opt/ingate/apiserver-client:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18072/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  apiserver:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-apiserver:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      INGATE_APISERVER_BEARER_TOKEN: "${INGATE_APISERVER_BEARER_TOKEN:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-apiserver.yaml:/opt/ingate/apiserver/configs/config.yaml:ro"
      - apiserver-certificates:/opt/ingate/apiserver/certificates
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/opt/ingate/apiserver/certificates/apiserver.crt", "-fsS", "https://127.0.0.1:18443/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  controller:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-controller:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      apiserver:
        condition: service_healthy
    ports:
      - "${INGATE_BIND_ADDRESS:-127.0.0.1}:${INGATE_HTTP_PORT:-8080}:8080"
      - "${INGATE_BIND_ADDRESS:-127.0.0.1}:${INGATE_HTTPS_PORT:-8443}:8443"
    environment:
      INGATE_APISERVER_BEARER_TOKEN: "${INGATE_APISERVER_BEARER_TOKEN:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-controller.yaml:/opt/ingate/controller/configs/config.yaml:ro"
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/kubeconfig.yaml:/opt/ingate/controller/configs/kubeconfig.yaml:ro"
      - apiserver-certificates:/opt/ingate/apiserver-client:ro
      - controller-wasm:/data/ingate/controller/wasm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  envoy:
    image: envoyproxy/envoy:v1.39.0
    restart: unless-stopped
    network_mode: service:controller
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/envoy-bootstrap.yaml:/etc/envoy/envoy.yaml:ro"
      # Controller 原子写入内容寻址文件，Envoy 只读加载，避免运行时远程拉取 Wasm 的不稳定路径
      - controller-wasm:/data/ingate/controller/wasm:ro
    depends_on:
      controller:
        condition: service_healthy
      als:
        condition: service_healthy
      ai-extproc:
        condition: service_healthy
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/15000; printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  admin-api:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-admin-api:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      apiserver:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      INGATE_APISERVER_BEARER_TOKEN: "${INGATE_APISERVER_BEARER_TOKEN:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-admin-api.yaml:/opt/ingate/admin-api/configs/config.yaml:ro"
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/kubeconfig.yaml:/opt/ingate/admin-api/configs/kubeconfig.yaml:ro"
      - apiserver-certificates:/opt/ingate/apiserver-client:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  assistant:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-assistant:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    command: ["--config", "/opt/ingate/assistant/configs/config.yaml", "--role", "all"]
    depends_on:
      mysql:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      INGATE_MYSQL_PASSWORD: "${INGATE_MYSQL_PASSWORD:-ingate-dev}"
      INGATE_ASSISTANT_MODEL_HEALTH_URL: "${INGATE_ASSISTANT_MODEL_HEALTH_URL:-http://host.docker.internal:11434/api/version}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-assistant.yaml:/opt/ingate/assistant/configs/config.yaml:ro"
    healthcheck:
      # Assistant 是可选能力；容器存活不代表模型等外部依赖已经就绪。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  console:
    image: "${INGATE_IMAGE_REGISTRY:-ghcr.io/lgc202}/ingate-console:${INGATE_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      admin-api:
        condition: service_healthy
    ports:
      - "${INGATE_BIND_ADDRESS:-127.0.0.1}:${INGATE_CONSOLE_PORT:-8001}:8001"
    environment:
      INGATE_ADMIN_PASSWORD: "${INGATE_ADMIN_PASSWORD:-}"
      INGATE_SESSION_SECRET: "${INGATE_SESSION_SECRET:-}"
    volumes:
      - "${INGATE_DEPLOY_ROOT:-./deploy/docker}/configs/ingate-console.yaml:/opt/ingate/console/configs/config.yaml:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  als-data:
  apiserver-certificates:
  clickhouse-data:
  controller-wasm:
  etcd-data:
  kafka-data:
  mysql-data:
  redis-data:
