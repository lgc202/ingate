server:
  http:
    addr: ":8082"
    timeout: "30s"
  shutdown_timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "_output/kubeconfig"
  analytics:
    addr: "127.0.0.1:18101"
    timeout: "5s"
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""
      server_name: ""
  ai_ext_proc:
    addr: "127.0.0.1:18081"
    timeout: "2s"
  plugin_catalog:
    url: "https://lgc202.github.io/ingate/plugins/v1/catalog.json"
    refresh_interval: "3600s"
    timeout: "5s"
logging:
  format: "json"
  level: "info"
  add_source: false
