server:
  http:
    addr: ":8081"
    timeout: "30s"
  console_dir: "web/console/dist"
  shutdown_timeout: "30s"
  authentication:
    enabled: false
    username: "admin"
    password: "${ADMIN_PASSWORD:}"
    session_secret: "${SESSION_SECRET:}"
    session_ttl: "43200s"
    secure_cookie: false

data:
  admin_api:
    base_url: "http://127.0.0.1:8082"
  assistant:
    base_url: "http://127.0.0.1:8083"

logging:
  format: "json"
  level: "info"
  add_source: false
