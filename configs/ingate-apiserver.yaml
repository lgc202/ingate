server:
  http:
    addr: "127.0.0.1:18443"
    cert_directory: "_output/certificates"
  authentication:
    bearer_token: "${APISERVER_BEARER_TOKEN:ingate-dev-control-plane-token-change-me}"
  shutdown_timeout: "30s"

data:
  etcd:
    endpoints:
      - "http://127.0.0.1:2379"
    prefix: "/registry/gateway.ingate.io"

logging:
  format: "json"
  level: "info"
  add_source: false
