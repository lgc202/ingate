# TLS 和登录限流尚未接入，HTTP 和 gRPC 只允许监听本机回环地址。
server:
  http:
    network: tcp
    addr: 127.0.0.1:8000
    timeout: 5s
  grpc:
    network: tcp
    addr: 127.0.0.1:9000
    timeout: 5s
api_server:
  kubeconfig: /etc/ingate/admin-api.kubeconfig
mysql:
  # 每实例的示例连接池参数；部署时结合数据库容量和组件实例数调整。
  dsn: ingate:change-me@tcp(127.0.0.1:3306)/ingate
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 1800s
  connection_max_idle_time: 300s
  ping_timeout: 3s
log:
  level: info
  format: json
  outputs: [stdout]
redis:
  addrs:
    - 127.0.0.1:6379
  db: 0
  ping_timeout: 3s
