# TLS 和登录限流尚未接入，HTTP 和 gRPC 只允许监听本机回环地址。
server:
  http:
    network: tcp
    addr: 127.0.0.1:8000
    timeout: 5s
  grpc:
    network: tcp
    addr: 127.0.0.1:9000
    timeout: 5s
api_server:
  kubeconfig: /etc/ingate/admin-api.kubeconfig
mysql:
  dsn: ingate:change-me@tcp(127.0.0.1:3306)/ingate
redis:
  url: redis://127.0.0.1:6379/0
