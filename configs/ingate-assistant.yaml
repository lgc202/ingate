server:
  http:
    addr: ":8083"
    readiness_timeout: "5s"
  shutdown_timeout: "30s"

data:
  mysql:
    address: "127.0.0.1:3306"
    database: "ingate"
    username: "ingate"
    password: "${MYSQL_PASSWORD:ingate-dev}"
    dial_timeout: "5s"
    max_open_connections: 20
    max_idle_connections: 10
    connection_max_lifetime: "1800s"

temporal:
  address: "127.0.0.1:7233"
  namespace: "ingate"
  task_queue: "ingate-assistant"
  connect_timeout: "10s"
  worker_stop_timeout: "20s"

model:
  health_url: "${ASSISTANT_MODEL_HEALTH_URL:http://127.0.0.1:11434/api/version}"
  health_timeout: "5s"

logging:
  format: "json"
  level: "info"
  add_source: false
