server:
  http:
    addr: ":8083"
    timeout: "5s"
  shutdown_timeout: "30s"

data:
  mysql:
    address: "127.0.0.1:3306"
    database: "ingate"
    username: "ingate"
    password: "${MYSQL_PASSWORD:ingate-dev}"
    dial_timeout: "5s"
    max_open_connections: 20
    max_idle_connections: 10
    connection_max_lifetime: "1800s"
  redis:
    address: "127.0.0.1:6379"
    password: ""
    database: 0
    dial_timeout: "3s"
    read_timeout: "20s"
    write_timeout: "3s"
    pool_size: 20

stream:
  retention: "86400s"
  max_events: 2000
  read_block: "15s"

logging:
  format: "json"
  level: "info"
  add_source: false
