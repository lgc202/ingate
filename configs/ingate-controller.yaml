server:
  grpc:
    addr: "127.0.0.1:18000"
  http:
    addr: "127.0.0.1:18080"
    timeout: "5s"
  shutdown_timeout: "30s"

data:
  apiserver:
    master: ""
    kubeconfig: "_output/kubeconfig"
    bearer_token: "${APISERVER_BEARER_TOKEN:ingate-dev-control-plane-token-change-me}"
  wasm:
    cache_dir: "_output/data/controller/wasm"
    pull_timeout: "30s"
    max_module_bytes: 67108864
    max_cache_bytes: 536870912

delivery:
  candidate_ack_timeout: "30s"
  nack_rollback_timeout: "3s"

resource_watch:
  resync_period: "0s"

logging:
  format: "json"
  level: "info"
  add_source: false
