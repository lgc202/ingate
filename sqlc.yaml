version: "2"

sql:
  - engine: "mysql"
    schema: "internal/admin/store/accesskey/sql/schema.sql"
    queries: "internal/admin/store/accesskey/sql/query.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/admin/store/accesskey/sqlc"
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
