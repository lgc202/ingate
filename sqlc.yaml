version: "2"
sql:
  - engine: mysql
    schema: internal/assistant/data/mysql/migrations
    queries: internal/assistant/data/mysql/query
    gen:
      go:
        package: db
        out: internal/assistant/data/mysql/db
        sql_package: database/sql
        emit_interface: false
        emit_json_tags: false
        emit_empty_slices: true
