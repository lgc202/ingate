<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="title desc">
  <title id="title">ALS 批次投递分支</title>
  <desc id="desc">允许直写时先发送 Kafka，否则或 Kafka 失败时完整批次写入 WAL，WAL 也失败才拒绝。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker>
    <marker id="bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#C25450"/></marker>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:13px;font-weight:650}.sub{font-size:10px;fill:#667085}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.decision{fill:#FFF;stroke:#667085;stroke-width:1.2}.oknode{fill:#F3F8F6;stroke:#35836D;stroke-width:1.4}.badnode{fill:#FFF5F4;stroke:#C25450;stroke-width:1.4}.line{fill:none;stroke:#667085;stroke-width:1.5}.badline{fill:none;stroke:#C25450;stroke-width:1.5}</style>
  </defs>
  <rect width="860" height="310" fill="#FFF"/>

  <line class="line" x1="120" y1="75" x2="165" y2="75" marker-end="url(#arrow)"/>
  <line class="line" x1="275" y1="75" x2="325" y2="75" marker-end="url(#arrow)"/>
  <line class="line" x1="435" y1="75" x2="480" y2="75" marker-end="url(#arrow)"/>
  <line class="line" x1="590" y1="75" x2="740" y2="75" marker-end="url(#arrow)"/>
  <path class="badline" d="M220 110V230H350" marker-end="url(#bad)"/>
  <path class="badline" d="M535 110V175H410V205" marker-end="url(#bad)"/>
  <line class="line" x1="470" y1="230" x2="525" y2="230" marker-end="url(#arrow)"/>
  <path class="line" d="M635 230H690V100Q690 75 715 75H740" marker-end="url(#arrow)"/>
  <line class="badline" x1="635" y1="230" x2="740" y2="230" marker-end="url(#bad)"/>

  <rect class="node" x="20" y="50" width="100" height="50" rx="4"/>
  <text class="label" x="70" y="80" text-anchor="middle">有效批次</text>

  <polygon class="decision" points="220,40 275,75 220,110 165,75"/>
  <text class="label" x="220" y="71" text-anchor="middle">可直写</text>
  <text class="sub" x="220" y="86" text-anchor="middle">Kafka</text>

  <rect class="node" x="325" y="50" width="110" height="50" rx="4"/>
  <text class="label" x="380" y="80" text-anchor="middle">发布 Kafka</text>

  <polygon class="decision" points="535,40 590,75 535,110 480,75"/>
  <text class="label" x="535" y="80" text-anchor="middle">全部确认</text>

  <rect class="node" x="350" y="205" width="120" height="50" rx="4"/>
  <text class="label" x="410" y="226" text-anchor="middle">整批写 WAL</text>
  <text class="sub" x="410" y="243" text-anchor="middle">append + sync</text>

  <polygon class="decision" points="580,195 635,230 580,265 525,230"/>
  <text class="label" x="580" y="235" text-anchor="middle">追加成功</text>

  <rect class="oknode" x="740" y="50" width="100" height="50" rx="4"/>
  <text class="label" x="790" y="80" text-anchor="middle">已接收</text>

  <rect class="badnode" x="740" y="205" width="100" height="50" rx="4"/>
  <text class="label" x="790" y="226" text-anchor="middle">拒绝</text>
  <text class="sub" x="790" y="243" text-anchor="middle">Unavailable</text>

  <text class="sub" x="300" y="64">是</text>
  <text class="sub" x="235" y="151">否</text>
  <text class="sub" x="655" y="65">是</text>
  <text class="sub" x="460" y="165">否 / 不确定</text>
  <text class="sub" x="672" y="219">是</text>
  <text class="sub" x="682" y="248">否</text>
</svg>
