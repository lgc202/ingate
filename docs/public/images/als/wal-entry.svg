<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">WAL 条目与确认顺序</title>
  <desc id="desc">记录批次编码为带版本、时间、Trace Context 和 CRC32C 的 QueueEntry，同步追加后等待 Kafka 确认，最后截断队首。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:13px;font-weight:650}.sub{font-size:10px;fill:#667085}.code{font-size:9px;fill:#475467;font-family:"SFMono-Regular",Consolas,monospace}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.entry{fill:#F7F4FA;stroke:#826A88;stroke-width:1.4}.ok{fill:#F3F8F6;stroke:#35836D;stroke-width:1.3}.line{stroke:#667085;stroke-width:1.5}</style></defs>
  <rect width="900" height="230" fill="#FFF"/>

  <line class="line" x1="120" y1="110" x2="165" y2="110" marker-end="url(#arrow)"/>
  <line class="line" x1="385" y1="110" x2="440" y2="110" marker-end="url(#arrow)"/>
  <line class="line" x1="560" y1="110" x2="615" y2="110" marker-end="url(#arrow)"/>
  <line class="line" x1="725" y1="110" x2="780" y2="110" marker-end="url(#arrow)"/>

  <rect class="node" x="20" y="82" width="100" height="56" rx="4"/>
  <text class="label" x="70" y="106" text-anchor="middle">记录批次</text>
  <text class="sub" x="70" y="124" text-anchor="middle">RequestRecord[]</text>

  <rect class="entry" x="165" y="20" width="220" height="180" rx="4"/>
  <text class="label" x="275" y="45" text-anchor="middle">QueueEntry v1</text>
  <text class="code" x="190" y="72">format_version</text>
  <text class="code" x="190" y="95">enqueued_at_unix_nano</text>
  <text class="code" x="190" y="118">records[]</text>
  <text class="code" x="190" y="141">traceparent / tracestate</text>
  <text class="code" x="190" y="164">crc32c</text>
  <text class="sub" x="275" y="187" text-anchor="middle">deterministic protobuf</text>

  <rect class="ok" x="440" y="82" width="120" height="56" rx="4"/>
  <text class="label" x="500" y="106" text-anchor="middle">WAL 追加</text>
  <text class="sub" x="500" y="124" text-anchor="middle">append + fsync</text>

  <rect class="node" x="615" y="82" width="110" height="56" rx="4"/>
  <text class="label" x="670" y="106" text-anchor="middle">Kafka</text>
  <text class="sub" x="670" y="124" text-anchor="middle">Publish</text>

  <rect class="node" x="780" y="82" width="100" height="56" rx="4"/>
  <text class="label" x="830" y="106" text-anchor="middle">Commit</text>
  <text class="sub" x="830" y="124" text-anchor="middle">TruncateFront</text>
</svg>
