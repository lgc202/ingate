<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
  <title id="title">Kafka 确认丢失与 WAL 回放</title>
  <desc id="desc">Kafka 已写入但确认丢失，Recorder 把同一 ID 写入 WAL，重放后 Analytics 收到相同 ID 的重复。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.actor{font-size:13px;font-weight:650}.msg{font-size:10px;fill:#475467}.life{stroke:#CBD0D6;stroke-width:1;stroke-dasharray:4 4}.line{stroke:#667085;stroke-width:1.4}.lost{stroke:#C25450;stroke-width:1.4;stroke-dasharray:5 4}</style></defs>
  <text class="actor" x="90" y="28" text-anchor="middle">Recorder</text>
  <text class="actor" x="300" y="28" text-anchor="middle">WAL</text>
  <text class="actor" x="520" y="28" text-anchor="middle">Kafka</text>
  <text class="actor" x="735" y="28" text-anchor="middle">Analytics</text>
  <line class="life" x1="90" y1="40" x2="90" y2="320"/>
  <line class="life" x1="300" y1="40" x2="300" y2="320"/>
  <line class="life" x1="520" y1="40" x2="520" y2="320"/>
  <line class="life" x1="735" y1="40" x2="735" y2="320"/>

  <line class="line" x1="90" y1="75" x2="520" y2="75" marker-end="url(#arrow)"/>
  <text class="msg" x="305" y="66" text-anchor="middle">Publish(id=7f…)</text>

  <line class="lost" x1="520" y1="115" x2="120" y2="115"/>
  <path d="M104 108L116 122M116 108L104 122" stroke="#C25450" stroke-width="1.6"/>
  <text class="msg" x="320" y="106" text-anchor="middle">ACK 丢失，结果不确定</text>

  <line class="line" x1="90" y1="165" x2="300" y2="165" marker-end="url(#arrow)"/>
  <text class="msg" x="195" y="156" text-anchor="middle">Append(id=7f…)</text>
  <line class="line" x1="300" y1="195" x2="90" y2="195" marker-end="url(#arrow)"/>
  <text class="msg" x="195" y="188" text-anchor="middle">fsync 成功</text>

  <line class="line" x1="90" y1="245" x2="520" y2="245" marker-end="url(#arrow)"/>
  <text class="msg" x="305" y="236" text-anchor="middle">Replay(id=7f…)</text>
  <line class="line" x1="520" y1="285" x2="735" y2="285" marker-end="url(#arrow)"/>
  <text class="msg" x="627.5" y="276" text-anchor="middle">同 ID 可能出现两次</text>
</svg>
