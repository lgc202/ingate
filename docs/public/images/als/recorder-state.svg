<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" role="img" aria-labelledby="title desc">
  <title id="title">Recorder 状态迁移</title>
  <desc id="desc">Kafka 写入失败进入 WAL 降级，队列排空后恢复直写，永久错误使回放暂停。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker><marker id="bad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#C25450"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:14px;font-weight:650}.sub{font-size:10px;fill:#667085}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.active{fill:#F3F8F6;stroke:#35836D;stroke-width:1.4}.paused{fill:#FFF5F4;stroke:#C25450;stroke-width:1.4}.line{fill:none;stroke:#667085;stroke-width:1.5}.badline{fill:none;stroke:#C25450;stroke-width:1.5}</style></defs>
  <rect width="780" height="220" fill="#FFF"/>

  <line class="badline" x1="190" y1="75" x2="300" y2="75" marker-end="url(#bad)"/>
  <line class="badline" x1="460" y1="75" x2="570" y2="75" marker-end="url(#bad)"/>
  <path class="line" d="M380 110V165H110V110" marker-end="url(#arrow)"/>
  <path class="line" d="M650 110V190H380V110" marker-end="url(#arrow)"/>

  <rect class="active" x="30" y="45" width="160" height="65" rx="4"/>
  <text class="label" x="110" y="72" text-anchor="middle">Kafka 直写</text>
  <text class="sub" x="110" y="91" text-anchor="middle">spooling=false</text>

  <rect class="node" x="300" y="45" width="160" height="65" rx="4"/>
  <text class="label" x="380" y="72" text-anchor="middle">WAL 降级</text>
  <text class="sub" x="380" y="91" text-anchor="middle">spooling=true</text>

  <rect class="paused" x="570" y="45" width="160" height="65" rx="4"/>
  <text class="label" x="650" y="72" text-anchor="middle">回放暂停</text>
  <text class="sub" x="650" y="91" text-anchor="middle">permanent error</text>

  <text class="sub" x="245" y="65" text-anchor="middle">Kafka 失败</text>
  <text class="sub" x="515" y="65" text-anchor="middle">队首永久错误</text>
  <text class="sub" x="245" y="157" text-anchor="middle">Topic 合规 · 无在途写入 · 队列空</text>
  <text class="sub" x="515" y="183" text-anchor="middle">修复后重启</text>
</svg>
