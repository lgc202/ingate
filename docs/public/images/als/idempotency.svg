<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">请求记录 ID 传递</title>
  <desc id="desc">ALS 解析时生成 UUID，Kafka、WAL、Analytics 和 ClickHouse 传递同一记录 ID。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#35836D"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:13px;font-weight:650}.sub{font-size:10px;fill:#667085}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.focus{fill:#F7F4FA;stroke:#826A88;stroke-width:1.4}.line{stroke:#35836D;stroke-width:1.6}</style></defs>
  <rect width="900" height="150" fill="#FFF"/>
  <line class="line" x1="130" y1="70" x2="175" y2="70" marker-end="url(#arrow)"/>
  <line class="line" x1="315" y1="70" x2="365" y2="70" marker-end="url(#arrow)"/>
  <line class="line" x1="515" y1="70" x2="565" y2="70" marker-end="url(#arrow)"/>
  <line class="line" x1="685" y1="70" x2="735" y2="70" marker-end="url(#arrow)"/>

  <rect class="node" x="20" y="42" width="110" height="56" rx="4"/>
  <text class="label" x="75" y="66" text-anchor="middle">Envoy 日志</text>
  <text class="sub" x="75" y="84" text-anchor="middle">request_id</text>

  <rect class="focus" x="175" y="42" width="140" height="56" rx="4"/>
  <text class="label" x="245" y="66" text-anchor="middle">ALS 解析</text>
  <text class="sub" x="245" y="84" text-anchor="middle">id = UUID v4</text>

  <rect class="node" x="365" y="42" width="150" height="56" rx="4"/>
  <text class="label" x="440" y="66" text-anchor="middle">Kafka / WAL</text>
  <text class="sub" x="440" y="84" text-anchor="middle">key 与回放 ID 不变</text>

  <rect class="node" x="565" y="42" width="120" height="56" rx="4"/>
  <text class="label" x="625" y="66" text-anchor="middle">Analytics</text>
  <text class="sub" x="625" y="84" text-anchor="middle">批内去重</text>

  <rect class="node" x="735" y="42" width="145" height="56" rx="4"/>
  <text class="label" x="807.5" y="66" text-anchor="middle">ClickHouse</text>
  <text class="sub" x="807.5" y="84" text-anchor="middle">dedup token = id</text>
</svg>
