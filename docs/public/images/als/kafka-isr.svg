<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">Kafka 三副本与 ISR</title>
  <desc id="desc">ALS Producer 写入 Leader，Leader 向两个 Follower 复制，acks all 在当前 ISR 满足确认后返回。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#35836D"/></marker><marker id="back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:13px;font-weight:650}.sub{font-size:10px;fill:#667085}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.leader{fill:#FFF6F2;stroke:#C96E4B;stroke-width:1.4}.isr{fill:#F3F8F6;stroke:#35836D;stroke-width:1.3}.optional{fill:#FFF;stroke:#98A2B3;stroke-width:1.2;stroke-dasharray:5 4}.line{fill:none;stroke:#35836D;stroke-width:1.5}.ack{fill:none;stroke:#667085;stroke-width:1.3;stroke-dasharray:5 4}.group{fill:none;stroke:#B8C8C2;stroke-width:1;stroke-dasharray:4 4}</style></defs>
  <rect width="820" height="260" fill="#FFF"/>
  <rect class="group" x="170" y="20" width="410" height="220" rx="4"/>
  <text class="sub" x="185" y="39">Partition 0 · replication.factor=3 · min ISR=2</text>

  <line class="line" x1="125" y1="130" x2="205" y2="130" marker-end="url(#arrow)"/>
  <line class="line" x1="335" y1="110" x2="410" y2="75" marker-end="url(#arrow)"/>
  <line class="line" x1="335" y1="150" x2="410" y2="185" marker-end="url(#arrow)"/>
  <line class="ack" x1="205" y1="150" x2="125" y2="150" marker-end="url(#back)"/>

  <rect class="node" x="20" y="100" width="105" height="60" rx="4"/>
  <text class="label" x="72.5" y="126" text-anchor="middle">ALS Producer</text>
  <text class="sub" x="72.5" y="145" text-anchor="middle">acks=all</text>

  <rect class="leader" x="205" y="100" width="130" height="60" rx="4"/>
  <text class="label" x="270" y="126" text-anchor="middle">Broker 1</text>
  <text class="sub" x="270" y="145" text-anchor="middle">Leader · ISR</text>

  <rect class="isr" x="410" y="48" width="130" height="54" rx="4"/>
  <text class="label" x="475" y="71" text-anchor="middle">Broker 2</text>
  <text class="sub" x="475" y="88" text-anchor="middle">Follower · ISR</text>

  <rect class="isr" x="410" y="158" width="130" height="54" rx="4"/>
  <text class="label" x="475" y="181" text-anchor="middle">Broker 3</text>
  <text class="sub" x="475" y="198" text-anchor="middle">Follower · ISR</text>

  <rect class="optional" x="650" y="100" width="140" height="60" rx="4"/>
  <text class="label" x="720" y="126" text-anchor="middle">Broker 4+</text>
  <text class="sub" x="720" y="145" text-anchor="middle">其他分区的副本</text>

  <text class="sub" x="160" y="119">写入</text>
  <text class="sub" x="372" y="74">复制</text>
  <text class="sub" x="372" y="194">复制</text>
  <text class="sub" x="137" y="164">ISR 确认后 ACK</text>
</svg>
