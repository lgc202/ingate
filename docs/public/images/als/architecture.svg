<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">ALS 请求记录链路</title>
  <desc id="desc">Recorder 正常直写 Kafka，写入失败时降级到本地 WAL，恢复后回放到 Kafka。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#667085"/></marker>
    <marker id="ok-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#35836D"/></marker>
    <marker id="fail-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#C25450"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#20252B}.label{font-size:15px;font-weight:650}.sub{font-size:10px;fill:#667085}.edge{fill:none;stroke:#667085;stroke-width:1.6}.ok{fill:none;stroke:#35836D;stroke-width:1.8}.fail{fill:none;stroke:#C25450;stroke-width:1.8}.node{fill:#FFF;stroke:#98A2B3;stroke-width:1.2}.core{fill:#F3F8F6;stroke:#35836D;stroke-width:1.5}.store{fill:#F7F4FA;stroke:#826A88;stroke-width:1.3}
    </style>
  </defs>
  <rect width="900" height="240" fill="#FFF"/>

  <line class="edge" x1="130" y1="75" x2="175" y2="75" marker-end="url(#arrow)"/>
  <line class="edge" x1="295" y1="75" x2="340" y2="75" marker-end="url(#arrow)"/>
  <line class="ok" x1="470" y1="75" x2="550" y2="75" marker-end="url(#ok-arrow)"/>
  <line class="fail" x1="405" y1="105" x2="405" y2="155" marker-end="url(#fail-arrow)"/>
  <path class="ok" d="M470 185H505Q530 185 530 160V105H605" marker-end="url(#ok-arrow)"/>
  <line class="edge" x1="660" y1="75" x2="720" y2="75" marker-end="url(#arrow)"/>

  <rect class="node" x="20" y="45" width="110" height="60" rx="4"/>
  <text class="label" x="75" y="71" text-anchor="middle">Envoy</text>
  <text class="sub" x="75" y="90" text-anchor="middle">access log</text>

  <rect class="node" x="175" y="45" width="120" height="60" rx="4"/>
  <text class="label" x="235" y="71" text-anchor="middle">ALS Service</text>
  <text class="sub" x="235" y="90" text-anchor="middle">解析与校验</text>

  <rect class="core" x="340" y="45" width="130" height="60" rx="4"/>
  <text class="label" x="405" y="71" text-anchor="middle">Recorder</text>
  <text class="sub" x="405" y="90" text-anchor="middle">选择写入目标</text>

  <rect class="node" x="550" y="45" width="110" height="60" rx="4"/>
  <text class="label" x="605" y="71" text-anchor="middle">Kafka</text>
  <text class="sub" x="605" y="90" text-anchor="middle">request records</text>

  <rect class="node" x="720" y="45" width="155" height="60" rx="4"/>
  <text class="label" x="797.5" y="71" text-anchor="middle">Analytics</text>
  <text class="sub" x="797.5" y="90" text-anchor="middle">ClickHouse</text>

  <rect class="store" x="340" y="155" width="130" height="60" rx="4"/>
  <text class="label" x="405" y="181" text-anchor="middle">本地 WAL</text>
  <text class="sub" x="405" y="200" text-anchor="middle">待回放批次</text>

  <text class="sub" x="152" y="65" text-anchor="middle">gRPC</text>
  <text class="sub" x="317" y="65" text-anchor="middle">有效记录</text>
  <text class="sub" x="510" y="65" text-anchor="middle">直写</text>
  <text class="sub" x="420" y="136">故障</text>
  <text class="sub" x="518" y="177" text-anchor="middle">回放</text>
  <text class="sub" x="690" y="65" text-anchor="middle">消费</text>
</svg>
