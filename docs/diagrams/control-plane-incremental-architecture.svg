<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="领域资源经源缓存、krt、配置发布器到 Envoy 与 Go AI Proxy 的配置流">
<!-- 手工坐标 SVG 源文件；布局只用水平/垂直连线。 -->
<style>
:root{--old:#b45309;--old-bg:#fef3c7;--new:#1d4ed8;--new-bg:#dbeafe;--infra:#047857;--infra-bg:#d1fae5;--ext:#475569;--ink:#0f172a;--muted:#64748b;--border:#e2e8f0}
text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.svg-t{font-size:12.5px;fill:var(--ink)}.svg-s{font-size:11px;fill:var(--muted)}.svg-title{font-size:13px;font-weight:700;fill:var(--ink)}
</style>
<rect width="900" height="410" fill="#fff"/>
<defs><marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--ext)"/></marker></defs>
<g fill="none" stroke="var(--ext)" stroke-width="1.5" marker-end="url(#arch-arrow)"><path d="M200 50H255"/><path d="M445 50H500"/><path d="M690 50H740V125H450V150"/><path d="M450 204V230H230V255"/><path d="M450 204V230H670V255"/><path d="M230 305V320H410V340"/><path d="M670 305V320H490V340"/><path d="M382 367H230"/><path d="M518 367H670"/></g>
<rect x="10" y="20" width="190" height="60" rx="6" fill="var(--infra-bg)" stroke="var(--infra)"/><text x="105" y="46" text-anchor="middle" class="svg-t">API Server / etcd</text><text x="105" y="64" text-anchor="middle" class="svg-s">六种领域资源</text>
<rect x="255" y="20" width="190" height="60" rx="6" fill="var(--old-bg)" stroke="var(--old)"/><text x="350" y="46" text-anchor="middle" class="svg-t">源缓存（Informer）</text><text x="350" y="64" text-anchor="middle" class="svg-s">统一接收资源变化</text>
<rect x="500" y="20" width="190" height="60" rx="6" fill="var(--new-bg)" stroke="var(--new)"/><text x="595" y="46" text-anchor="middle" class="svg-t">krt 计算图</text><text x="595" y="64" text-anchor="middle" class="svg-s">引用解析 · 裁决 · 资源生成</text>
<text x="450" y="116" text-anchor="middle" class="svg-s">领域资源 → 内部表示（IR）→ 命名资源</text>
<rect x="335" y="150" width="230" height="54" rx="6" fill="var(--old-bg)" stroke="var(--old)"/><text x="450" y="174" text-anchor="middle" class="svg-t">配置发布器</text><text x="450" y="191" text-anchor="middle" class="svg-s">引用校验 · 资源版本 · 更新/删除</text>
<rect x="115" y="255" width="230" height="50" rx="6" fill="var(--old-bg)" stroke="var(--old)"/><text x="230" y="278" text-anchor="middle" class="svg-t">Envoy SnapshotCache</text><text x="230" y="295" text-anchor="middle" class="svg-s">原生 LDS / RDS / CDS / EDS</text>
<rect x="555" y="255" width="230" height="50" rx="6" fill="var(--new-bg)" stroke="var(--new)"/><text x="670" y="278" text-anchor="middle" class="svg-t">AI LinearCache</text><text x="670" y="295" text-anchor="middle" class="svg-s">Entry / ModelRule / MCPRoute</text>
<rect x="382" y="340" width="136" height="54" rx="6" fill="var(--new-bg)" stroke="var(--new)"/><text x="450" y="372" text-anchor="middle" class="svg-t">Delta ADS 服务</text>
<rect x="70" y="345" width="160" height="44" rx="6" fill="var(--old-bg)" stroke="var(--old)"/><text x="150" y="372" text-anchor="middle" class="svg-t">Envoy</text>
<rect x="670" y="345" width="170" height="44" rx="6" fill="var(--old-bg)" stroke="var(--old)"/><text x="755" y="372" text-anchor="middle" class="svg-t">Go AI Proxy</text>
</svg>
