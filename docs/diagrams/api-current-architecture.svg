<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">当前 Ingate HTTP API 网关架构</title>
  <desc id="desc">Admin API 写 API Server，Controller 订阅资源并发布 xDS，MySQL 保存异步查询投影。HTTP 经 Envoy 转发；真实整链路尚未验收。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5B8A72"/></marker></defs>
  <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#252525;font-size:17px;text-anchor:middle}.note{font-size:14px;fill:#666}.edge{fill:none;stroke:#5B8A72;stroke-width:2;marker-end:url(#arrow)}.box{fill:#F5F8F6;stroke:#5B8A72;stroke-width:1.5}.store{fill:#F5F3F8;stroke:#8B6F8A;stroke-width:1.5}</style>
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <g class="edge">
    <path marker-end="url(#arrow)" d="M240 125 H360"/>
    <path marker-end="url(#arrow)" d="M610 125 H790"/>
    <path marker-end="url(#arrow)" d="M485 160 V280"/>
    <path marker-end="url(#arrow)" d="M900 160 V230 H135 V280"/>
    <path marker-end="url(#arrow)" d="M135 280 V160"/>
    <path marker-end="url(#arrow)" d="M1080 145 H1100 V430 H505 V470"/>
    <path marker-end="url(#arrow)" d="M240 505 H400"/>
    <path marker-end="url(#arrow)" d="M610 505 H790"/>
  </g>
  <g>
    <text x="300" y="112" class="note">资源写入</text>
    <text x="700" y="112" class="note">List / Watch</text>
    <text x="565" y="212" class="note">etcd 存储</text>
    <text x="710" y="219" class="note">异步投影</text>
    <text x="63" y="217" class="note">查询读取</text>
    <text x="835" y="419" class="note">ADS / xDS（SotW）</text>
    <text x="320" y="491" class="note">HTTP</text>
    <text x="700" y="491" class="note">HTTP 转发</text>
    <rect class="box" x="30" y="90" width="210" height="70" rx="10"/>
    <text x="135" y="119">Admin API</text><text x="135" y="143" class="note">资源管理 · 管理员 Session</text>
    <rect class="box" x="360" y="90" width="250" height="70" rx="10"/>
    <text x="485" y="119">Ingate API Server</text><text x="485" y="143" class="note" style="font-size:13px">Gateway / HTTPRoute / Backend</text>
    <rect class="box" x="790" y="90" width="290" height="70" rx="10"/>
    <text x="935" y="119">Controller Manager</text><text x="935" y="143" class="note">引用裁决 → 编译 → 发布</text>
    <rect class="store" x="30" y="280" width="210" height="70" rx="10"/>
    <text x="135" y="309">MySQL 查询模型</text><text x="135" y="333" class="note">不是数据面配置源</text>
    <rect class="store" x="380" y="280" width="210" height="70" rx="10"/>
    <text x="485" y="309">etcd</text><text x="485" y="333" class="note">声明式资源权威存储</text>
    <rect class="box" x="30" y="470" width="210" height="70" rx="10"/>
    <text x="135" y="511">HTTP 客户端</text>
    <rect class="box" x="400" y="470" width="210" height="70" rx="10"/>
    <text x="505" y="499">Envoy</text><text x="505" y="523" class="note">尚缺真实进程联动验收</text>
    <rect class="box" x="790" y="470" width="290" height="70" rx="10"/>
    <text x="935" y="511">HTTP 后端</text>
    <text x="560" y="580" class="note">已有实现关系；请求箭头省略反向响应。账户存储与 Redis Session 不在资源配置主路径内。</text>
  </g>
</svg>
