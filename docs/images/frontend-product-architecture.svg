<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>.bg{fill:#f6f8fb}.card{fill:#fff;stroke:#e5e7eb;stroke-width:1;rx:8}.title{fill:#111827;font:700 30px 'PingFang SC','Noto Sans CJK SC',sans-serif}.subtitle{fill:#6b7280;font:400 15px 'PingFang SC','Noto Sans CJK SC',sans-serif}.section{fill:#111827;font:700 21px 'PingFang SC','Noto Sans CJK SC',sans-serif}.body{fill:#374151;font:400 16px 'PingFang SC','Noto Sans CJK SC',sans-serif}.chip-blue{fill:#dbeafe;rx:16}.chip-green{fill:#dcfce7;rx:16}.chip-text-blue{fill:#1d4ed8;font:600 13px 'PingFang SC','Noto Sans CJK SC',sans-serif}.chip-text-green{fill:#15803d;font:600 13px 'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="1600" height="1000" class="bg"/><rect x="70" y="110" width="1460" height="780" class="card"/><text x="110" y="166" class="title">Ingate 控制台第一版产品页面结构</text><text x="110" y="206" class="subtitle">面向用户组织页面，前端通过 Admin API 产品 DTO 交互，不直接暴露内部资源或实现细节</text><text x="110" y="284" class="section">第一版导航</text><rect x="110" y="310" width="64" height="32" class="chip-blue"/><text x="124" y="331" class="chip-text-blue">首页</text><rect x="280" y="310" width="64" height="32" class="chip-green"/><text x="294" y="331" class="chip-text-green">网关</text><rect x="450" y="310" width="64" height="32" class="chip-green"/><text x="464" y="331" class="chip-text-green">路由</text><rect x="620" y="310" width="88" height="32" class="chip-green"/><text x="634" y="331" class="chip-text-green">后端服务</text><rect x="790" y="310" width="64" height="32" class="chip-green"/><text x="804" y="331" class="chip-text-green">证书</text><rect x="960" y="310" width="64" height="32" class="chip-green"/><text x="974" y="331" class="chip-text-green">插件</text><rect x="1130" y="310" width="64" height="32" class="chip-green"/><text x="1144" y="331" class="chip-text-green">监控</text><rect x="1300" y="310" width="88" height="32" class="chip-green"/><text x="1314" y="331" class="chip-text-green">系统设置</text><text x="110" y="430" class="section">主链路</text><text x="160" y="510" class="section">网关</text><text x="350" y="510" class="section">-&gt; 路由</text><text x="590" y="510" class="section">-&gt; 后端服务</text><text x="890" y="510" class="section">+ 插件策略</text><text x="1180" y="510" class="section">+ 证书引用</text><text x="110" y="590" class="section">边界约束</text><text x="110" y="640" class="body">网关：入口监听、数据面组、域名绑定；证书只引用独立证书资源</text><text x="110" y="690" class="body">路由：匹配规则、后端服务、策略配置；超时、重试、路径改写都属于策略</text><text x="110" y="740" class="body">后端服务：应用、模型服务、Agent 服务、MCP 服务统一作为转发目标</text><text x="110" y="790" class="body">插件：插件包、版本和数据面组部署；不会自动给未配置路由套默认策略</text></svg>