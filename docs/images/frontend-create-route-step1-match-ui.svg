<text x="290" y="50" class="title">创建路由</text><text x="290" y="82" class="subtitle">第 1 步：定义请求匹配规则</text><rect x="1188" y="24" width="154" height="40" class="env-pill"/><text x="1208" y="50" class="body">生产环境</text><text x="1314" y="50" class="muted">▼</text>
<rect x="290" y="150" width="280" height="700" class="card"/><text x="318" y="198" class="section">创建流程</text><rect x="318" y="228" width="36" height="36" class="button-primary"/><text x="331" y="252" class="button-primary-text">1</text><text x="372" y="252" class="body-strong">匹配规则</text><rect x="318" y="320" width="36" height="36" class="field"/><text x="331" y="344" class="body-strong">2</text><text x="372" y="344" class="body">后端服务</text><rect x="318" y="412" width="36" height="36" class="field"/><text x="331" y="436" class="body-strong">3</text><text x="372" y="436" class="body">配置策略</text><rect x="318" y="504" width="36" height="36" class="field"/><text x="331" y="528" class="body-strong">4</text><text x="372" y="528" class="body">发布预览</text><rect x="610" y="150" width="900" height="700" class="card"/><text x="642" y="198" class="section">基本信息与匹配</text><text x="642" y="230" class="small">匹配条件只决定请求是否命中路由，不放超时、重试、路径改写</text><text x="642" y="270" class="label">路由名称 *</text><rect x="642" y="284" width="300" height="42" class="field"/><text x="658" y="312" class="body">chat-completions</text><text x="982" y="270" class="label">所属网关 *</text><rect x="982" y="284" width="300" height="42" class="field"/><text x="998" y="312" class="body">public-gateway</text><text x="1254" y="312" class="muted">▼</text><text x="642" y="378" class="label">匹配域名</text><rect x="642" y="392" width="640" height="42" class="field"/><text x="658" y="420" class="body">api.example.com, chat.example.com</text><text x="1254" y="420" class="muted">▼</text><text x="1300" y="420" class="small">可多个</text><text x="642" y="486" class="label">匹配路径 *</text><rect x="642" y="500" width="300" height="42" class="field"/><text x="658" y="528" class="body">/v1/chat/completions</text><text x="982" y="486" class="label">请求方法</text><rect x="982" y="500" width="300" height="42" class="field"/><text x="998" y="528" class="body">POST, OPTIONS</text><text x="1254" y="528" class="muted">▼</text><text x="642" y="616" class="section">高级匹配</text><text x="642" y="648" class="small">可选条件可以配置多条，全部满足时才命中当前路由</text><rect x="642" y="682" width="20" height="20" class="check-on"/><text x="647" y="698" class="check-text">✓</text><text x="674" y="700" class="body">Header 条件</text><rect x="842" y="682" width="20" height="20" class="check-on"/><text x="847" y="698" class="check-text">✓</text><text x="874" y="700" class="body">Query 条件</text><rect x="1042" y="682" width="20" height="20" class="check"/><text x="1074" y="700" class="body">Cookie 条件</text><rect x="1242" y="682" width="20" height="20" class="check"/><text x="1274" y="700" class="body">来源 IP</text><rect x="240" y="900" width="1360" height="100" class="footer"/><rect x="1080" y="924" width="86" height="38" class="button"/><text x="1098" y="948" class="button-text">取消</text><rect x="1200" y="924" width="86" height="38" class="button-primary"/><text x="1218" y="948" class="button-primary-text">下一步</text>
