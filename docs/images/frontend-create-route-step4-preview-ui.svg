    <text x="32" y="944" class="sidebar-text" >生产环境</text>

  <rect x="250" y="0" width="1350" height="78" rx="0" class="topbar"/>
  <text x="290" y="49" class="title" >创建路由</text>

  <rect x="290" y="110" width="1040" height="64" rx="10" class="card"/><rect x="322" y="128" width="34" height="28" rx="14" class="chip-green"/><text x="338" y="147" class="chip-text-green" >1</text><text x="368" y="149" class="body" >匹配条件</text><rect x="558" y="128" width="34" height="28" rx="14" class="chip-green"/><text x="574" y="147" class="chip-text-green" >2</text><text x="604" y="149" class="body" >后端服务</text><rect x="794" y="128" width="34" height="28" rx="14" class="chip-green"/><text x="810" y="147" class="chip-text-green" >3</text><text x="840" y="149" class="body" >策略配置</text><rect x="1030" y="128" width="34" height="28" rx="14" class="chip-blue"/><text x="1046" y="147" class="chip-text-blue" >4</text><text x="1076" y="149" class="body-strong" >发布预览</text>
    <rect x="290" y="204" width="1040" height="618" rx="10" class="card"/><text x="318" y="244" class="section" >发布预览</text><text x="318" y="272" class="small" >展示本次变更会影响哪些资源，发布前先做可达性和插件部署检查</text><rect x="318" y="314" width="692" height="48" rx="8" class="panel"/><text x="336" y="345" class="body-strong" >路由</text><text x="572" y="345" class="small" >chat-completions</text><rect x="318" y="376" width="692" height="48" rx="8" class="panel"/><text x="336" y="407" class="body-strong" >网关</text><text x="572" y="407" class="small" >public-gateway / prod-shanghai</text><rect x="318" y="438" width="692" height="48" rx="8" class="panel"/><text x="336" y="469" class="body-strong" >匹配</text><text x="572" y="469" class="small" >POST api.example.com/v1/chat/completions</text><rect x="318" y="500" width="692" height="48" rx="8" class="panel"/><text x="336" y="531" class="body-strong" >后端</text><text x="572" y="531" class="small" >qwen-plus 80% / qwen-turbo 20%</text><rect x="318" y="562" width="692" height="48" rx="8" class="panel"/><text x="336" y="593" class="body-strong" >策略</text><text x="572" y="593" class="small" >鉴权、Token 统计、内容安全、超时重试</text><rect x="318" y="624" width="692" height="48" rx="8" class="panel"/><text x="336" y="655" class="body-strong" >检查</text><text x="572" y="655" class="small" >后端可达，插件已部署，证书有效</text>
    <rect x="290" y="852" width="1040" height="72" rx="10" class="card"/><rect x="920" y="868" width="92" height="38" rx="8" class="ghost"/><text x="942" y="893" class="body-strong" >上一步</text><rect x="1028" y="868" width="112" height="38" rx="8" class="button"/><text x="1050" y="893" class="button-text" >发布</text>
