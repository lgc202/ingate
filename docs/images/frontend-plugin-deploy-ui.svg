  <rect x="290" y="110" width="1254" height="92" rx="10" class="card"/><text x="318" y="150" class="section" >部署插件配置</text><text x="318" y="178" class="small" >安装包和部署范围在插件页管理，路由页只启用具体策略参数</text><rect x="290" y="236" width="1254" height="604" rx="10" class="card"/><text x="318" y="306" class="label" >插件</text><text x="372" y="306" class="required" >*</text><rect x="318" y="320" width="330" height="44" rx="8" class="input"/><text x="334" y="348" class="body-strong" >AI Token 统计</text><text x="618" y="348" class="body" >⌄</text><text x="690" y="306" class="label" >插件版本</text><text x="760" y="306" class="required" >*</text><rect x="690" y="320" width="330" height="44" rx="8" class="input"/><text x="706" y="348" class="body-strong" >v1.4.2</text><text x="990" y="348" class="body" >⌄</text>
    <text x="318" y="410" class="label" >包地址</text><text x="372" y="410" class="required" >*</text><rect x="318" y="424" width="702" height="44" rx="8" class="input"/><text x="334" y="452" class="body-strong" >registry.local/plugins/ai-token-meter:v1.4.2</text><text x="318" y="514" class="label" >校验摘要</text><text x="388" y="514" class="required" >*</text><rect x="318" y="528" width="702" height="44" rx="8" class="input"/><text x="334" y="556" class="body-strong" >sha256:8f2a2a5d9a0f4a9d8d31cd</text>
    <text x="318" y="618" class="label" >失败策略</text><rect x="318" y="632" width="330" height="44" rx="8" class="input"/><text x="334" y="660" class="body-strong" >失败放行</text><text x="618" y="660" class="body" >⌄</text><text x="690" y="618" class="label" >部署范围</text><text x="760" y="618" class="required" >*</text><rect x="690" y="632" width="330" height="44" rx="8" class="input"/><text x="706" y="660" class="body-strong" >prod-shanghai, prod-beijing</text><text x="990" y="660" class="body" >⌄</text>
    <rect x="1080" y="380" width="360" height="220" rx="10" class="chip-gray"/><text x="1110" y="422" class="section" >发布检查</text><text x="1110" y="464" class="body" >包地址可访问</text><text x="1110" y="500" class="body" >摘要校验通过</text><text x="1110" y="536" class="body" >目标数据面组版本兼容</text><rect x="290" y="870" width="1254" height="70" rx="10" class="card"/><rect x="1188" y="886" width="92" height="38" rx="8" class="ghost"/><text x="1210" y="911" class="body-strong" >取消</text><rect x="1296" y="886" width="146" height="38" rx="8" class="button"/><text x="1318" y="911" class="button-text" >确认部署</text>
