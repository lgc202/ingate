<text x="290" y="50" class="title">系统设置</text><text x="290" y="82" class="subtitle">环境、数据面组、用户角色、审计、通知和全局参数</text><rect x="1188" y="24" width="154" height="40" class="env-pill"/><text x="1208" y="50" class="body">生产环境</text><text x="1314" y="50" class="muted">▼</text>
<rect x="290" y="112" width="1260" height="748" class="card"/><text x="318" y="160" class="section">平台配置</text><text x="318" y="192" class="small">系统设置只放配置项，不展示流量趋势、调用日志、证书列表或数据面运行看板</text><rect x="318" y="242" width="210" height="560" class="panel"/><text x="348" y="286" class="body-strong">环境管理</text><text x="348" y="346" class="body-strong">数据面组</text><text x="348" y="406" class="body-strong">用户与角色</text><text x="348" y="466" class="body-strong">审计设置</text><text x="348" y="526" class="body-strong">通知设置</text><text x="348" y="586" class="body-strong">全局安全</text><text x="348" y="646" class="body-strong">系统参数</text><rect x="568" y="242" width="900" height="560" class="panel"/><text x="602" y="286" class="section">环境管理</text><text x="602" y="318" class="small">环境是全局上下文，用于资源隔离和权限判断；页面顶部负责切换当前环境</text><rect x="602" y="360" width="820" height="44" class="table-head"/><text x="616" y="388" class="label">环境</text><text x="836" y="388" class="label">标识</text><text x="996" y="388" class="label">默认数据面组</text><text x="1256" y="388" class="label">状态</text><line x1="602" y1="404" x2="1422" y2="404" class="line"/><text x="616" y="440" class="body-strong">生产环境</text><text x="836" y="440" class="body">prod</text><text x="996" y="440" class="body">prod-shanghai</text><text x="1256" y="440" class="body">启用</text><line x1="602" y1="462" x2="1422" y2="462" class="line"/><text x="616" y="498" class="body-strong">预发环境</text><text x="836" y="498" class="body">staging</text><text x="996" y="498" class="body">staging-shanghai</text><text x="1256" y="498" class="body">启用</text><line x1="602" y1="520" x2="1422" y2="520" class="line"/><text x="616" y="556" class="body-strong">测试环境</text><text x="836" y="556" class="body">test</text><text x="996" y="556" class="body">test-shanghai</text><text x="1256" y="556" class="body">启用</text><line x1="602" y1="578" x2="1422" y2="578" class="line"/><text x="602" y="620" class="section">数据面组说明</text><text x="602" y="660" class="body">数据面组不是单个实例，而是一组高可用数据面实例；网关和插件都按数据面组选择生效范围</text><rect x="240" y="900" width="1360" height="100" class="footer"/><rect x="1100" y="924" width="86" height="38" class="button"/><text x="1118" y="948" class="button-text">重置</text><rect x="1220" y="924" width="100" height="38" class="button-primary"/><text x="1238" y="948" class="button-primary-text">保存设置</text>
