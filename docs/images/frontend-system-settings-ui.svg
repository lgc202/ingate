<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .page{fill:#f5f7fa}.sidebar{fill:#101827}.sidebar-active{fill:#2563eb}.topbar{fill:#fff;stroke:#e5e7eb}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1.2}.panel{fill:#f8fafc;stroke:#e5e7eb;stroke-width:1.1}.input{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .ghost{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.button{fill:#2563eb}.table-head{fill:#f8fafc}.line{stroke:#e5e7eb}.strong-line{stroke:#93c5fd;stroke-width:2.4}
      .brand{font:800 26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .title{font:700 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .section{font:700 20px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:500 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .body{font:400 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#334155}
      .body-strong{font:600 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .small{font:400 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .metric{font:800 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sidebar-text{font:500 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .sidebar-active-text{font:700 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .sidebar-muted{font:400 14px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .button-text{font:700 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .placeholder{font:400 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .required{fill:#ef4444}.help{fill:#2563eb}
      .chip-blue{fill:#dbeafe}.chip-green{fill:#dcfce7}.chip-orange{fill:#ffedd5}.chip-purple{fill:#ede9fe}.chip-gray{fill:#f1f5f9}.chip-red{fill:#fee2e2}
      .chip-text-blue{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .chip-text-green{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#15803d}
      .chip-text-orange{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#c2410c}
      .chip-text-purple{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#6d28d9}
      .chip-text-gray{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#475569}
      .chip-text-red{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" rx="0" class="page"/>

    <rect x="0" y="0" width="250" height="1000" rx="0" class="sidebar"/>
    <text x="32" y="55" class="brand" >Ingate</text>
    <text x="32" y="84" class="sidebar-muted" >AI Gateway Console</text>
    <text x="54" y="147" class="sidebar-text" >首页</text><text x="54" y="203" class="sidebar-text" >网关</text><text x="54" y="259" class="sidebar-text" >路由</text><text x="54" y="315" class="sidebar-text" >后端服务</text><text x="54" y="371" class="sidebar-text" >证书</text><text x="54" y="427" class="sidebar-text" >插件</text><text x="54" y="483" class="sidebar-text" >监控</text><rect x="18" y="511" width="214" height="44" rx="10" class="sidebar-active"/><text x="54" y="539" class="sidebar-active-text" >系统设置</text>
    <text x="32" y="914" class="sidebar-muted" >当前环境</text>
    <text x="32" y="944" class="sidebar-text" >生产环境</text>

  <rect x="250" y="0" width="1350" height="78" rx="0" class="topbar"/>
  <text x="290" y="49" class="title" >系统设置</text>
  <rect x="1296" y="20" width="92" height="38" rx="8" class="ghost"/><text x="1318" y="45" class="body-strong" >重置</text><rect x="1404" y="20" width="108" height="38" rx="8" class="button"/><text x="1426" y="45" class="button-text" >保存</text>
  <rect x="290" y="110" width="1254" height="92" rx="10" class="card"/><text x="318" y="150" class="section" >平台配置</text><text x="318" y="178" class="small" >系统设置只处理平台参数，不展示运行监控</text>
    <rect x="290" y="236" width="260" height="620" rx="10" class="card"/><text x="346" y="300" class="chip-text-blue" >环境管理</text><text x="346" y="358" class="body" >数据面组</text><text x="346" y="416" class="body" >用户与角色</text><text x="346" y="474" class="body" >审计设置</text><text x="346" y="532" class="body" >通知设置</text><text x="346" y="590" class="body" >全局安全</text><text x="346" y="648" class="body" >系统参数</text>
    <rect x="580" y="236" width="964" height="620" rx="10" class="card"/><text x="608" y="276" class="section" >环境管理</text><text x="608" y="304" class="small" >环境用于隔离资源、权限和默认数据面组</text>
    <rect x="612" y="346" width="276" height="116" rx="10" class="panel"/><text x="640" y="384" class="body-strong" >生产环境</text><text x="640" y="416" class="small" >标识 prod</text><rect x="764" y="372" width="72" height="28" rx="14" class="chip-green"/><text x="780" y="391" class="chip-text-green" >启用</text>
    <rect x="912" y="346" width="276" height="116" rx="10" class="panel"/><text x="940" y="384" class="body-strong" >预发环境</text><text x="940" y="416" class="small" >标识 staging</text><rect x="1064" y="372" width="72" height="28" rx="14" class="chip-green"/><text x="1080" y="391" class="chip-text-green" >启用</text>
    <rect x="1212" y="346" width="276" height="116" rx="10" class="panel"/><text x="1240" y="384" class="body-strong" >测试环境</text><text x="1240" y="416" class="small" >标识 test</text><rect x="1364" y="372" width="72" height="28" rx="14" class="chip-green"/><text x="1380" y="391" class="chip-text-green" >启用</text>
    <text x="612" y="548" class="label" >默认环境</text><rect x="612" y="562" width="320" height="44" rx="8" class="input"/><text x="628" y="590" class="body-strong" >生产环境</text><text x="902" y="590" class="body" >⌄</text><text x="972" y="548" class="label" >默认数据面组</text><rect x="972" y="562" width="320" height="44" rx="8" class="input"/><text x="988" y="590" class="body-strong" >prod-shanghai</text><text x="1262" y="590" class="body" >⌄</text>
    <text x="612" y="662" class="label" >配置发布策略</text><rect x="612" y="676" width="320" height="44" rx="8" class="input"/><text x="628" y="704" class="body-strong" >人工确认后发布</text><text x="902" y="704" class="body" >⌄</text><text x="972" y="662" class="label" >审计保留时间</text><rect x="972" y="676" width="320" height="44" rx="8" class="input"/><text x="988" y="704" class="body-strong" >180 天</text><text x="1262" y="704" class="body" >⌄</text>
</svg>
