<rect x="290" y="116" width="1260" height="744" class="card"/><text x="318" y="158" class="section">基础信息</text><text x="318" y="188" class="label">网关名称 *</text><rect x="318" y="202" width="300" height="42" class="field"/><text x="334" y="230" class="body">public-gateway</text><text x="650" y="188" class="label">数据面组 *</text><rect x="650" y="202" width="260" height="42" class="field"/><text x="666" y="230" class="body">prod-shanghai</text><text x="882" y="230" class="muted">▼</text><text x="942" y="188" class="label">入口说明</text><rect x="942" y="202" width="360" height="42" class="field"/><text x="958" y="230" class="body">公网生产入口</text><text x="318" y="304" class="section">监听器</text><rect x="1386" y="280" width="100" height="38" class="button"/><text x="1404" y="304" class="button-text">添加监听</text><text x="318" y="336" class="small">监听器只定义协议和端口，不在这里直接保存证书内容</text><rect x="318" y="360" width="1188" height="44" class="table-head"/><text x="332" y="388" class="label">监听器</text><text x="512" y="388" class="label">协议</text><text x="662" y="388" class="label">端口</text><text x="782" y="388" class="label">TLS 模式</text><text x="962" y="388" class="label">说明</text><text x="1322" y="388" class="label">操作</text><line x1="318" y1="404" x2="1506" y2="404" class="line"/><text x="332" y="440" class="body-strong">https</text><text x="512" y="440" class="body">HTTPS</text><text x="662" y="440" class="body">443</text><text x="782" y="440" class="body">SNI 多证书</text><text x="962" y="440" class="body">承载多个 HTTPS 域名</text><text x="1322" y="440" class="body">编辑 / 删除</text><line x1="318" y1="462" x2="1506" y2="462" class="line"/><text x="332" y="498" class="body-strong">http</text><text x="512" y="498" class="body">HTTP</text><text x="662" y="498" class="body">80</text><text x="782" y="498" class="body">不启用 TLS</text><text x="962" y="498" class="body">仅做明文入口或跳转</text><text x="1322" y="498" class="body">编辑 / 删除</text><line x1="318" y1="520" x2="1506" y2="520" class="line"/><text x="318" y="56