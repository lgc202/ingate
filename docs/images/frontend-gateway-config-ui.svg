<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .page{fill:#f5f7fa}.sidebar{fill:#101827}.sidebar-active{fill:#2563eb}.topbar{fill:#fff;stroke:#e5e7eb}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1.2}.panel{fill:#f8fafc;stroke:#e5e7eb;stroke-width:1.1}.input{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .ghost{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.button{fill:#2563eb}.table-head{fill:#f8fafc}.line{stroke:#e5e7eb}.strong-line{stroke:#93c5fd;stroke-width:2.4}
      .brand{font:800 26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .title{font:700 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .section{font:700 20px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:500 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .body{font:400 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#334155}
      .body-strong{font:600 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .small{font:400 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .metric{font:800 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sidebar-text{font:500 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .sidebar-active-text{font:700 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .sidebar-muted{font:400 14px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .button-text{font:700 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .placeholder{font:400 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .required{fill:#ef4444}.help{fill:#2563eb}
      .chip-blue{fill:#dbeafe}.chip-green{fill:#dcfce7}.chip-orange{fill:#ffedd5}.chip-purple{fill:#ede9fe}.chip-gray{fill:#f1f5f9}.chip-red{fill:#fee2e2}
      .chip-text-blue{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .chip-text-green{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#15803d}
      .chip-text-orange{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#c2410c}
      .chip-text-purple{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#6d28d9}
      .chip-text-gray{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#475569}
      .chip-text-red{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" rx="0" class="page"/>

    <rect x="0" y="0" width="250" height="1000" rx="0" class="sidebar"/>
    <text x="32" y="55" class="brand" >Ingate</text>
    <text x="32" y="84" class="sidebar-muted" >AI Gateway Console</text>
    <text x="54" y="147" class="sidebar-text" >首页</text><rect x="18" y="175" width="214" height="44" rx="10" class="sidebar-active"/><text x="54" y="203" class="sidebar-active-text" >网关</text><text x="54" y="259" class="sidebar-text" >路由</text><text x="54" y="315" class="sidebar-text" >后端服务</text><text x="54" y="371" class="sidebar-text" >证书</text><text x="54" y="427" class="sidebar-text" >插件</text><text x="54" y="483" class="sidebar-text" >监控</text><text x="54" y="539" class="sidebar-text" >系统设置</text>
    <text x="32" y="914" class="sidebar-muted" >当前环境</text>
    <text x="32" y="944" class="sidebar-text" >生产环境</text>

  <rect x="250" y="0" width="1350" height="78" rx="0" class="topbar"/>
  <text x="290" y="49" class="title" >网关</text>

  <rect x="290" y="110" width="1254" height="92" rx="10" class="card"/><text x="318" y="150" class="section" >网关配置</text><text x="318" y="178" class="small" >企业级入口配置：环境和数据面组联动选择，一个网关可包含多个监听，每个监听可配置多个域名</text><rect x="290" y="236" width="1254" height="604" rx="10" class="card"/>
    <text x="318" y="278" class="section" >基本信息</text><text x="318" y="326" class="label" >网关名称</text><text x="388" y="326" class="required" >*</text><rect x="318" y="340" width="360" height="44" rx="8" class="input"/><text x="334" y="368" class="body-strong" >public-gateway</text><text x="720" y="326" class="label" >环境</text><text x="774" y="326" class="required" >*</text><rect x="720" y="340" width="360" height="44" rx="8" class="input"/><text x="736" y="368" class="body-strong" >生产环境</text><text x="1050" y="368" class="body" >⌄</text><text x="1122" y="326" class="label" >数据面组</text><text x="1192" y="326" class="required" >*</text><rect x="1122" y="340" width="360" height="44" rx="8" class="input"/><text x="1138" y="368" class="body-strong" >prod-shanghai · 4/4 健康</text><text x="1452" y="368" class="body" >⌄</text>
    <text x="318" y="430" class="section" >入口监听</text>
    <rect x="318" y="458" width="556" height="260" rx="10" class="panel"/><text x="346" y="494" class="body-strong" >监听 1</text><rect x="432" y="474" width="78" height="28" rx="14" class="chip-green"/><text x="448" y="493" class="chip-text-green" >HTTPS</text><text x="346" y="536" class="label" >端口</text><text x="400" y="536" class="required" >*</text><rect x="346" y="550" width="140" height="44" rx="8" class="input"/><text x="362" y="578" class="body-strong" >443</text><text x="510" y="536" class="label" >监听名称</text><text x="580" y="536" class="required" >*</text><rect x="510" y="550" width="220" height="44" rx="8" class="input"/><text x="526" y="578" class="body-strong" >public-https</text><text x="346" y="624" class="label" >访问域名</text><text x="416" y="624" class="help" >?</text><rect x="346" y="638" width="230" height="44" rx="8" class="input"/><text x="362" y="666" class="body-strong" >api.example.com</text><text x="596" y="624" class="label" >访问域名</text><rect x="596" y="638" width="230" height="44" rx="8" class="input"/><text x="612" y="666" class="body-strong" >chat.example.com</text><rect x="346" y="682" width="102" height="38" rx="8" class="ghost"/><text x="368" y="707" class="body-strong" >新增域名</text>
    <text x="910" y="536" class="label" >证书</text><text x="964" y="536" class="required" >*</text><rect x="910" y="550" width="280" height="44" rx="8" class="input"/><text x="926" y="578" class="body-strong" >api-example-cert</text><text x="1160" y="578" class="body" >⌄</text>
    <rect x="910" y="608" width="420" height="88" rx="10" class="chip-gray"/><text x="936" y="642" class="body-strong" >HTTPS 监听必须选择证书</text><text x="936" y="672" class="small" >证书资源在证书页面统一创建和续期</text>
    <rect x="318" y="738" width="556" height="76" rx="10" class="panel"/><text x="346" y="784" class="body-strong" >监听 2</text><rect x="432" y="764" width="68" height="28" rx="14" class="chip-blue"/><text x="448" y="783" class="chip-text-blue" >HTTP</text><text x="520" y="784" class="body" >80 / public-http / 所有域名</text>
    <rect x="910" y="748" width="112" height="38" rx="8" class="ghost"/><text x="932" y="773" class="body-strong" >新增监听</text><rect x="290" y="870" width="1254" height="70" rx="10" class="card"/><rect x="1188" y="886" width="92" height="38" rx="8" class="ghost"/><text x="1210" y="911" class="body-strong" >取消</text><rect x="1296" y="886" width="146" height="38" rx="8" class="button"/><text x="1318" y="911" class="button-text" >保存网关</text>
</svg>
