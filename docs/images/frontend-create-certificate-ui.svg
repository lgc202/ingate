<rect x="290" y="112" width="1260" height="748" class="card"/><text x="318" y="160" class="section">证书配置</text><text x="318" y="192" class="small">创建证书资源后，在网关域名绑定中选择引用</text><text x="318" y="238" class="label">证书名称 *</text><rect x="318" y="252" width="300" height="42" class="field"/><text x="334" y="280" class="body">api-example-cert</text><text x="650" y="238" class="label">证书来源 *</text><rect x="650" y="252" width="260" height="42" class="field"/><text x="666" y="280" class="body">手动上传</text><text x="882" y="280" class="muted">▼</text><text x="942" y="238" class="label">绑定域名 *</text><rect x="942" y="252" width="360" height="42" class="field"/><text x="958" y="280" class="body">api.example.com</text><text x="318" y="360" class="section">来源方式</text><rect x="318" y="392" width="20" height="20" class="check-on"/><text x="323" y="408" class="check-text">✓</text><text x="350" y="410" class="body">手动上传证书和私钥</text><rect x="580" y="392" width="20" height="20" class="check"/><text x="612" y="410" class="body">通过 ACME 自动签发</text><rect x="830" y="392" width="20" height="20" class="check"/><text x="862" y="410" class="body">引用已有 Secret 或外部证书</text><text x="318" y="510" class="section">证书内容</text><rect x="318" y="540" width="520" height="140" class="field"/><text x="346" y="600" class="body-strong">上传 PEM 证书或粘贴证书内容</text><rect x="690" y="608" width="100" height="38" class="button"/><text x="708" y="632" class="button-text">上传证书</text><rect x="878" y="540" width="520" height="140" class="field"/><text x="906" y="600" class="body-strong">上传 PEM 私钥或粘贴私钥内容</text><rect x="1240" y="608" width="100" height="38" class="button"/><text x="1258" y="632" class="button-text">上传私钥</text><text x="318" y="744" class="small">私钥属于敏感信息，保存后不在控制台明文回显</text><rect x="240" y="900" width="1360" height="100" class="footer"/><rect x="1110" y="924" width="86" height="38" class="button"/><text x="1128" y="948" class="button-text">取消</text><rect x="1220" y="924" width="100" height="38" class="button-primary"