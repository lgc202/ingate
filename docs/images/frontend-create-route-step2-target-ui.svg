<rect x="290" y="150" width="280" height="700" class="card"/><text x="318" y="198" class="section">创建流程</text><rect x="318" y="228" width="36" height="36" class="field"/><text x="331" y="252" class="body-strong">1</text><text x="372" y="252" class="body">匹配规则</text><rect x="318" y="320" width="36" height="36" class="button-primary"/><text x="331" y="344" class="button-primary-text">2</text><text x="372" y="344" class="body-strong">后端服务</text><rect x="318" y="412" width="36" height="36" class="field"/><text x="331" y="436" class="body-strong">3</text><text x="372" y="436" class="body">配置策略</text><rect x="318" y="504" width="36" height="36" class="field"/><text x="331" y="528" class="body-strong">4</text><text x="372" y="528" class="body">发布预览</text><rect x="610" y="150" width="900" height="700" class="card"/><text x="642" y="198" class="section">选择后端服务</text><text x="642" y="230" class="small">命中路由后转发到哪里。后端服务可以是应用、模型、Agent 或 MCP</text><text x="642" y="280" class="label">后端服务 *</text><rect x="642" y="294" width="420" height="42" class="field"/><text x="658" y="322" class="body">qwen-plus</text><text x="1034" y="322" class="muted">▼</text><rect x="1090" y="298" width="88" height="32" class="chip-purple"/><text x="1104" y="319" class="chip-text-purple">模型服务</text><text x="642" y="402" class="section">目标配置</text><text x="642" y="440" class="label">Fallback 服务</text><rect x="642" y="454" width="360" height="42" class="field"/><text x="658" y="482" class="body">deepseek-chat</text><text x="974" y="482" class="muted">▼</text><text x="1040" y="440" class="label">流式响应</text><rect x="1040" y="454" width="240" height="42" class="field"/><text x="1056" y="482" class="body">开启</text><text x="1252" y="482" class="muted">▼</text><text x="642" y="548" class="label">权重策略</text><rect x="642" y="562" width="360" height="42" class="field"/><text x="658" y="590" class="body">主服务 100%</text><text x="974" y="590" class="muted">▼</text><text x="1040" y="548" class="label">健康检查</text><rect x="1040" y="562" width="240" height="42" class="field"/><text x="1056" y="590" class="body">跟随后端服务</text><text x="1252" y="590" class="muted">▼</text><text x="642" y="690" class="label">说明</text><text x="642" y="724" class="body">模型、Agent、MCP 都作为后端服务维护；路由这里只选择目标并配置路由级覆盖项</text><rect x="240" y="900" width="1360" height="100" class="footer"/><rect x="980" y="924" width="86" height="38" class="button"/><text x="998" y="948" class="button-text">上一步</text><rect x="1100" y="924" width="86" height="38" class="button"/><text x="1118" y="948" class="button-text">取消</text><rect x="1220" y="924" width="86" height="38" class="button-primary"/><text x="1238" y="948" class="button-primary-text">下一步</text>
