<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .page{fill:#f5f7fa}.sidebar{fill:#101827}.sidebar-active{fill:#2563eb}.topbar{fill:#fff;stroke:#e5e7eb}
      .card{fill:#fff;stroke:#e5e7eb;stroke-width:1.2}.panel{fill:#f8fafc;stroke:#e5e7eb;stroke-width:1.1}.input{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .ghost{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.button{fill:#2563eb}.table-head{fill:#f8fafc}.line{stroke:#e5e7eb}.strong-line{stroke:#93c5fd;stroke-width:2.4}
      .brand{font:800 26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .title{font:700 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .section{font:700 20px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:500 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .body{font:400 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#334155}
      .body-strong{font:600 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .small{font:400 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#64748b}
      .metric{font:800 30px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sidebar-text{font:500 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .sidebar-active-text{font:700 18px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .sidebar-muted{font:400 14px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .button-text{font:700 16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#fff}
      .placeholder{font:400 15px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#94a3b8}
      .required{fill:#ef4444}.help{fill:#2563eb}
      .chip-blue{fill:#dbeafe}.chip-green{fill:#dcfce7}.chip-orange{fill:#ffedd5}.chip-purple{fill:#ede9fe}.chip-gray{fill:#f1f5f9}.chip-red{fill:#fee2e2}
      .chip-text-blue{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .chip-text-green{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#15803d}
      .chip-text-orange{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#c2410c}
      .chip-text-purple{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#6d28d9}
      .chip-text-gray{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#475569}
      .chip-text-red{font:700 13px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" rx="0" class="page"/>

    <rect x="0" y="0" width="250" height="1000" rx="0" class="sidebar"/>
    <text x="32" y="55" class="brand" >Ingate</text>
    <text x="32" y="84" class="sidebar-muted" >AI Gateway Console</text>
    <text x="54" y="147" class="sidebar-text" >首页</text><text x="54" y="203" class="sidebar-text" >网关</text><text x="54" y="259" class="sidebar-text" >路由</text><rect x="18" y="287" width="214" height="44" rx="10" class="sidebar-active"/><text x="54" y="315" class="sidebar-active-text" >后端服务</text><text x="54" y="371" class="sidebar-text" >证书</text><text x="54" y="427" class="sidebar-text" >插件</text><text x="54" y="483" class="sidebar-text" >监控</text><text x="54" y="539" class="sidebar-text" >系统设置</text>
    <text x="32" y="914" class="sidebar-muted" >当前环境</text>
    <text x="32" y="944" class="sidebar-text" >生产环境</text>

  <rect x="250" y="0" width="1350" height="78" rx="0" class="topbar"/>
  <text x="290" y="49" class="title" >创建后端服务</text>

  <rect x="290" y="110" width="1254" height="92" rx="10" class="card"/><text x="318" y="150" class="section" >创建后端服务配置</text><text x="318" y="178" class="small" >根据服务类型展示不同接入字段</text><rect x="290" y="236" width="1254" height="604" rx="10" class="card"/><text x="318" y="278" class="section" >服务类型</text>
    <rect x="318" y="310" width="72" height="28" rx="14" class="chip-blue"/><text x="334" y="329" class="chip-text-blue" >应用</text><rect x="402" y="310" width="96" height="28" rx="14" class="chip-purple"/><text x="418" y="329" class="chip-text-purple" >模型服务</text><rect x="514" y="310" width="78" height="28" rx="14" class="chip-orange"/><text x="530" y="329" class="chip-text-orange" >Agent</text><rect x="606" y="310" width="72" height="28" rx="14" class="chip-green"/><text x="622" y="329" class="chip-text-green" >MCP</text>
    <text x="318" y="388" class="label" >服务名称</text><text x="388" y="388" class="required" >*</text><rect x="318" y="402" width="330" height="44" rx="8" class="input"/><text x="334" y="430" class="body-strong" >qwen-plus</text><text x="690" y="388" class="label" >Provider</text><text x="824" y="388" class="required" >*</text><rect x="690" y="402" width="330" height="44" rx="8" class="input"/><text x="706" y="430" class="body-strong" >阿里云百炼</text><text x="990" y="430" class="body" >⌄</text>
    <text x="318" y="492" class="label" >模型名称</text><text x="388" y="492" class="required" >*</text><rect x="318" y="506" width="330" height="44" rx="8" class="input"/><text x="334" y="534" class="body-strong" >qwen-plus</text><text x="690" y="492" class="label" >协议适配</text><rect x="690" y="506" width="330" height="44" rx="8" class="input"/><text x="706" y="534" class="body-strong" >OpenAI 兼容</text><text x="990" y="534" class="body" >⌄</text>
    <text x="318" y="596" class="label" >调用地址</text><text x="388" y="596" class="required" >*</text><rect x="318" y="610" width="702" height="44" rx="8" class="input"/><text x="334" y="638" class="body-strong" >https://dashscope.aliyuncs.com/compatible-mode</text>
    <rect x="1080" y="384" width="360" height="190" rx="10" class="chip-gray"/><text x="1110" y="426" class="body-strong" >Agent / MCP 后续也放在后端服务</text><text x="1110" y="462" class="small" >路由统一选择后端服务，不把 AI 拆成另一套入口</text><text x="1110" y="498" class="small" >具体治理能力通过路由策略和插件启用</text><rect x="290" y="870" width="1254" height="70" rx="10" class="card"/><rect x="1188" y="886" width="92" height="38" rx="8" class="ghost"/><text x="1210" y="911" class="body-strong" >取消</text><rect x="1296" y="886" width="146" height="38" rx="8" class="button"/><text x="1318" y="911" class="button-text" >保存服务</text>
</svg>
