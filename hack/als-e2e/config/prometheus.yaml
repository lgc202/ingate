global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  # 演练直接加载生产规则，防止测试副本与实际告警定义漂移。
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: ingate-als
    static_configs:
      - targets: ["als:18092"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
