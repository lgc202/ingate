services:
  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.0.2
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic ingate.request-records
        --partitions 1
        --replication-factor 1
        --config min.insync.replicas=1
    depends_on:
      kafka:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - "${ALS_E2E_SOURCE}/deploy/docker/observability/loki.yaml:/etc/loki/config.yaml:ro"
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - "${ALS_E2E_SOURCE}/deploy/docker/observability/tempo.yaml:/etc/tempo/config.yaml:ro"
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - loki
      - tempo
    volumes:
      - "${ALS_E2E_SOURCE}/hack/als-e2e/config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"
      - "${ALS_E2E_ROOT}/logs:/work/logs:ro"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
    volumes:
      - "${ALS_E2E_SOURCE}/hack/als-e2e/config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"
      - "${ALS_E2E_SOURCE}/deploy/docker/observability/rules:/etc/prometheus/rules:ro"
      - prometheus-data:/prometheus

  probe:
    image: alpine:3.22.1
    command: ["/work/bin/als-e2e", "serve"]
    volumes:
      - "${ALS_E2E_ROOT}:/work"
      - als-data:/work/data

  als:
    image: alpine:3.22.1
    command: ["/work/bin/ingate-als", "--config", "/work/config/als.yaml"]
    environment:
      INGATE_ALS_QUEUE_PATH: /work/data/queue
    volumes:
      - "${ALS_E2E_ROOT}:/work"
      - als-data:/work/data

  als-diagnostic:
    image: alpine:3.22.1
    command: ["/work/bin/ingate-als", "--config", "/work/config/als.yaml"]
    environment:
      INGATE_ALS_QUEUE_PATH: /work/data/corrupt
    volumes:
      - "${ALS_E2E_ROOT}:/work"
      - als-data:/work/data

  envoy:
    image: envoyproxy/envoy:v1.39.0
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - "${ALS_E2E_SOURCE}/hack/als-e2e/config/envoy.yaml:/etc/envoy/envoy.yaml:ro"

volumes:
  als-data:
  kafka-data:
  loki-data:
  prometheus-data:
  tempo-data:
