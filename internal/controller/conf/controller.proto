syntax = "proto3";

package ingate.controller.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/controller/conf;conf";

// Bootstrap 定义 ingate-controller 的完整进程配置
message Bootstrap {
  // server 定义 xDS 和运维 HTTP 的监听与退出行为
  Server server = 1;
  // data 定义声明式资源 API 连接
  Data data = 2;
  // delivery 定义 Envoy 配置发布时序
  Delivery delivery = 3;
  // resource_watch 定义声明式资源监听行为
  ResourceWatch resource_watch = 4;
  // logging 定义进程日志行为
  Logging logging = 5;
}

// Server 定义 Controller 的协议入口
message Server {
  message GRPC {
    // addr 是 Envoy 连接的 xDS gRPC 监听地址
    string addr = 1;
  }
  message HTTP {
    // addr 是健康检查的 HTTP 监听地址
    string addr = 1;
    // timeout 限制单次运维 HTTP 请求处理时间
    google.protobuf.Duration timeout = 2;
  }
  // grpc 暴露 Envoy ADS 服务
  GRPC grpc = 1;
  // http 暴露健康检查和就绪检查
  HTTP http = 2;
  // shutdown_timeout 是等待 Controller 各执行循环停止的最长时间
  google.protobuf.Duration shutdown_timeout = 3;
}

// Data 定义 Controller 使用的数据依赖与本地状态
message Data {
  message APIServer {
    // master 覆盖 kubeconfig 中的 API Server 地址
    string master = 1;
    // kubeconfig 保存声明式资源 API 的连接与认证配置
    string kubeconfig = 2;
  }
  message Wasm {
    // cache_dir 保存 Controller 已校验的 Wasm 模块
    string cache_dir = 1;
    // pull_timeout 限制单次 HTTP 或 OCI 拉取耗时
    google.protobuf.Duration pull_timeout = 2;
    // max_module_bytes 拒绝超过上限的单个 Wasm 模块
    int64 max_module_bytes = 3;
    // max_cache_bytes 限制 Wasm 磁盘缓存总量
    int64 max_cache_bytes = 4;
  }
  // apiserver 提供 Controller 监听和回写的声明式资源
  APIServer apiserver = 1;
  // wasm 拉取、校验并缓存 Envoy 执行的 Wasm 模块
  Wasm wasm = 2;
}

// Delivery 定义 Candidate 配置的确认和回退期限
message Delivery {
  // candidate_ack_timeout 是 Envoy 首次收到 Candidate 后的 ACK 等待时间
  google.protobuf.Duration candidate_ack_timeout = 1;
  // nack_rollback_timeout 是 NACK 后恢复 Active 配置的最长等待时间
  google.protobuf.Duration nack_rollback_timeout = 2;
}

// ResourceWatch 定义 informer 的资源重同步行为
message ResourceWatch {
  // resync_period 为零时只响应声明式资源变更事件
  google.protobuf.Duration resync_period = 1;
}

// Logging 定义结构化日志格式与级别
message Logging {
  // format 支持 json 和 text
  string format = 1;
  // level 支持 debug、info、warn 和 error
  string level = 2;
  // add_source 控制日志是否包含调用位置
  bool add_source = 3;
}
