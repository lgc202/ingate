syntax = "proto3";

package ingate.authz.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/authz/conf;conf";

// Bootstrap 定义 ingate-authz 的完整进程配置
message Bootstrap {
  Server server = 1;
  Logging logging = 2;
  Data data = 3;
}

// Data 定义 Caller 配置来源
message Data {
  message APIServer {
    string master = 1;
    string kubeconfig = 2;
    // bearer_token 认证 Authz 到声明式 API 的内部请求
    string bearer_token = 3;
  }
  message Redis {
    // address 是共享请求计数使用的 Redis 地址
    string address = 1;
    // password 为空表示 Redis 未启用认证
    string password = 2;
    // database 是请求限流使用的逻辑数据库
    int32 database = 3;
    // dial_timeout 限制建立 Redis 连接的时间
    google.protobuf.Duration dial_timeout = 4;
    // operation_timeout 限制单次限流计数的时间
    google.protobuf.Duration operation_timeout = 5;
  }
  APIServer apiserver = 1;
  Redis redis = 2;
}

// Server 定义 Envoy External Authorization 和运维入口
message Server {
  message GRPC {
    message TLS {
      // enabled 控制 Authz gRPC 服务是否启用 TLS
      bool enabled = 1;
      // cert_file 是服务端证书链文件
      string cert_file = 2;
      // key_file 是服务端私钥文件
      string key_file = 3;
      // client_ca_file 非空时启用 mTLS 并只信任该 CA 签发的 Envoy 客户端证书
      string client_ca_file = 4;
    }
    // addr 是 Envoy 连接的 gRPC 监听地址
    string addr = 1;
    // tls 保护 Envoy 到 Authz 的调用方凭据和准入结果
    TLS tls = 2;
  }
  message HTTP {
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }
  GRPC grpc = 1;
  HTTP http = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}

// Logging 定义结构化日志格式与级别
message Logging {
  string format = 1;
  string level = 2;
  bool add_source = 3;
}
