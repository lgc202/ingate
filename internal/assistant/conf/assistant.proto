syntax = "proto3";

package ingate.assistant.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/assistant/conf;conf";

// Bootstrap 定义 ingate-assistant 的完整进程配置。
message Bootstrap {
  // server 定义 HTTP 入口和进程退出期限。
  Server server = 1;
  // data 定义运维助手的持久存储。
  Data data = 2;
  // temporal 定义工作流服务和 Worker 行为。
  Temporal temporal = 3;
  // model 定义模型服务的可用性检查端点。
  Model model = 4;
  // logging 定义结构化日志行为。
  Logging logging = 5;
}

// Server 定义 Assistant HTTP 服务和进程退出行为。
message Server {
  // HTTP 定义 Assistant 的网络入口。
  message HTTP {
    // addr 是 HTTP 监听地址。
    string addr = 1;
    // readiness_timeout 是一次完整就绪检查的最长等待时间。
    google.protobuf.Duration readiness_timeout = 2;
  }
  // http 是 Assistant HTTP 服务配置。
  HTTP http = 1;
  // shutdown_timeout 是等待 HTTP 和 Worker 安全退出的最长时间。
  google.protobuf.Duration shutdown_timeout = 2;
}

// Data 定义 Assistant 使用的持久化基础设施。
message Data {
  // MySQL 保存后续运维助手功能产生的持久状态。
  message MySQL {
    // address 是 MySQL TCP 地址。
    string address = 1;
    // database 是 Assistant 使用的数据库名。
    string database = 2;
    // username 是数据库用户名。
    string username = 3;
    // password 是数据库密码，应通过环境变量注入。
    string password = 4;
    // dial_timeout 是建立数据库连接的最长等待时间。
    google.protobuf.Duration dial_timeout = 5;
    // max_open_connections 限制连接池总连接数。
    uint32 max_open_connections = 6;
    // max_idle_connections 限制连接池保留的空闲连接数。
    uint32 max_idle_connections = 7;
    // connection_max_lifetime 限制连接复用时长。
    google.protobuf.Duration connection_max_lifetime = 8;
  }
  // mysql 是 Assistant 的持久化事实来源。
  MySQL mysql = 1;
}

// Temporal 定义 Assistant 的工作流连接与 Worker 生命周期。
message Temporal {
  // address 是 Temporal Frontend gRPC 地址。
  string address = 1;
  // namespace 隔离 Ingate 的工作流。
  string namespace = 2;
  // task_queue 是当前 Assistant Worker 轮询的任务队列。
  string task_queue = 3;
  // connect_timeout 是启动时连接 Temporal 的最长等待时间。
  google.protobuf.Duration connect_timeout = 4;
  // worker_stop_timeout 是 Worker 等待在途任务安全结束的最长时间。
  google.protobuf.Duration worker_stop_timeout = 5;
}

// Model 定义 Assistant 启动后检查的模型服务端点。
message Model {
  // health_url 是不携带凭据且不产生模型调用的 HTTP 健康地址。
  string health_url = 1;
  // health_timeout 是单次模型健康请求的最长等待时间。
  google.protobuf.Duration health_timeout = 2;
}

// Logging 定义 Assistant 的结构化日志格式与级别。
message Logging {
  // format 支持 json 和 text。
  string format = 1;
  // level 支持 debug、info、warn 和 error。
  string level = 2;
  // add_source 控制日志是否包含调用位置。
  bool add_source = 3;
}
