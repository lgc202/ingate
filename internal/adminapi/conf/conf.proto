syntax = "proto3";

package adminapi.conf;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/adminapi/conf;conf";

// Bootstrap 表示 Admin API 启动所需的配置。
message Bootstrap {
  // server 配置入站服务。
  Server server = 1 [(buf.validate.field).required = true];
  // api_server 配置声明式 API Server 客户端。
  APIServer api_server = 2 [(buf.validate.field).required = true];
  // mysql 配置管理员账户与资源查询模型使用的 MySQL。
  MySQL mysql = 3 [(buf.validate.field).required = true];
  // redis 配置管理员登录态使用的 Redis。
  Redis redis = 4 [(buf.validate.field).required = true];
  // log 配置普通运行日志；省略时使用 info、JSON 和 stdout。
  Log log = 5;
}

// Log 配置启动时固定的原生 slog 输出，不包含请求日志。
message Log {
  option (buf.validate.message).cel = {
    id: "log.file_path"
    message: "file output requires a non-empty file path"
    expression: "!('file' in this.outputs) || (has(this.file) && this.file.path != '')"
  };

  // File 配置一个进程独占的轮转文件，路径相对进程工作目录解析。
  message File {
    // path 在选择 file 输出时必须非空。
    string path = 1;
    // max_size_mb 为 0 时沿用 lumberjack 的 100 MiB 默认值。
    int32 max_size_mb = 2 [(buf.validate.field).int32.gte = 0];
    // max_backups 为 0 时不按数量清理备份。
    int32 max_backups = 3 [(buf.validate.field).int32.gte = 0];
    // max_age_days 为 0 时不按天数清理备份。
    int32 max_age_days = 4 [(buf.validate.field).int32.gte = 0];
    // compress 是否使用 gzip 压缩备份。
    bool compress = 5;
  }

  // level 省略时为 info。
  string level = 1 [(buf.validate.field).string = {
    in: [
      "",
      "debug",
      "info",
      "warn",
      "error"
    ]
  }];
  // format 省略时为 json。
  string format = 2 [(buf.validate.field).string = {
    in: [
      "",
      "json",
      "text"
    ]
  }];
  // outputs 可组合但不能重复；省略时只输出 stdout。
  repeated string outputs = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "stdout",
          "stderr",
          "file"
        ]
      }
    }
  }];
  // add_source 是否在日志中附带调用位置。
  bool add_source = 4;
  // file 仅在选择 file 输出时启用。
  File file = 5;
}

// Server 配置 HTTP 和 gRPC 入站服务。
message Server {
  // HTTP 配置 HTTP 服务。
  message HTTP {
    // network 是监听使用的 TCP 网络类型。
    string network = 1 [(buf.validate.field).string = {
      in: [
        "tcp",
        "tcp4",
        "tcp6"
      ]
    }];
    // addr 是 HTTP 服务的监听地址。
    string addr = 2 [(buf.validate.field).string.min_len = 1];
    // timeout 是一次 HTTP 请求允许执行的最长时间。
    google.protobuf.Duration timeout = 3 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  // GRPC 配置 gRPC 服务。
  message GRPC {
    // network 是监听使用的 TCP 网络类型。
    string network = 1 [(buf.validate.field).string = {
      in: [
        "tcp",
        "tcp4",
        "tcp6"
      ]
    }];
    // addr 是 gRPC 服务的监听地址。
    string addr = 2 [(buf.validate.field).string.min_len = 1];
    // timeout 是一次 gRPC 调用允许执行的最长时间。
    google.protobuf.Duration timeout = 3 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  // http 配置 HTTP 服务。
  HTTP http = 1 [(buf.validate.field).required = true];
  // grpc 配置 gRPC 服务。
  GRPC grpc = 2 [(buf.validate.field).required = true];
}

// APIServer 配置声明式 API Server 连接。
message APIServer {
  // kubeconfig 是连接 API Server 的 kubeconfig 路径；为空时使用集群内配置。
  string kubeconfig = 1;
}

// MySQL 配置管理员账户与资源查询模型使用的数据库连接。
message MySQL {
  option (buf.validate.message).cel = {
    id: "mysql.pool_size"
    message: "max_idle_connections must not exceed max_open_connections"
    expression: "this.max_idle_connections <= this.max_open_connections"
  };

  // dsn 是 MySQL Driver 使用的连接字符串。
  string dsn = 1 [(buf.validate.field).string.min_len = 1];
  // max_open_connections 限制本组件的数据库连接总数。
  int32 max_open_connections = 2 [(buf.validate.field).int32.gt = 0];
  // max_idle_connections 是允许保留的空闲连接数，零值不保留。
  int32 max_idle_connections = 3 [(buf.validate.field).int32.gte = 0];
  // connection_max_lifetime 限制连接总存活时间。
  google.protobuf.Duration connection_max_lifetime = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
  // connection_max_idle_time 限制空闲连接的存活时间。
  google.protobuf.Duration connection_max_idle_time = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
  // ping_timeout 仅用于组件启动前探测，不进入共享客户端配置。
  google.protobuf.Duration ping_timeout = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
}

// Redis 配置管理员登录态使用的数据库连接。
message Redis {
  reserved 1;
  reserved "url";

  // addrs 是单节点地址或 Sentinel/Cluster 种子地址，不是连接 URL。
  repeated string addrs = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  // username 是 Redis 数据节点的 ACL 用户名。
  string username = 3;
  // password 是 Redis 数据节点的密码，不得写入日志。
  string password = 4;
  // sentinel_username 是 Sentinel 自身的 ACL 用户名。
  string sentinel_username = 5;
  // sentinel_password 是 Sentinel 自身的密码，不得写入日志。
  string sentinel_password = 6;
  // db 是单节点或 Sentinel 的数据库编号；Redis Cluster 必须为 0。
  int32 db = 7 [(buf.validate.field).int32.gte = 0];
  // master_name 非空时，addrs 指向 Sentinel，由驱动发现主节点。
  string master_name = 8;
  // is_cluster_mode 可在只有一个种子地址时启用 ClusterClient。
  // 与 master_name 一起设置时沿用驱动的 Sentinel FailoverClusterClient。
  bool is_cluster_mode = 9;
  // pool_size 是每个节点的连接池容量，0 沿用驱动默认值。
  int32 pool_size = 10 [(buf.validate.field).int32.gte = 0];
  // min_idle_conns 是每个节点的最小空闲连接数，0 不预建空闲连接。
  int32 min_idle_conns = 11 [(buf.validate.field).int32.gte = 0];
  // dial_timeout 是连接超时，未配置时沿用驱动默认值。
  google.protobuf.Duration dial_timeout = 12 [(buf.validate.field).duration.gt = {}];
  // read_timeout 是读取超时，未配置时沿用驱动默认值。
  google.protobuf.Duration read_timeout = 13 [(buf.validate.field).duration.gt = {}];
  // write_timeout 是写入超时，未配置时沿用驱动默认值。
  google.protobuf.Duration write_timeout = 14 [(buf.validate.field).duration.gt = {}];
  // pool_timeout 是等待可用连接的超时，未配置时沿用驱动默认值。
  google.protobuf.Duration pool_timeout = 15 [(buf.validate.field).duration.gt = {}];
  // tls 启用 TLS，使用系统可信根并验证服务器证书。
  bool tls = 16;
  // tls_server_name 可覆盖 TLS 证书验证使用的服务器名称。
  string tls_server_name = 17;
  // ping_timeout 仅用于启动探测，与连接、读写和连接池等待超时独立。
  google.protobuf.Duration ping_timeout = 18 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gt = {}
  ];
}
