syntax = "proto3";

package ingate.admin.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/adminapi/conf;conf";

// Bootstrap 定义 ingate-admin-api 的完整进程配置
message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logging logging = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

message Data {
  message APIServer {
    string master = 1;
    string kubeconfig = 2;
  }
  message MySQL {
    string dsn = 1;
    int32 max_open_connections = 2;
    int32 max_idle_connections = 3;
    google.protobuf.Duration connection_max_lifetime = 4;
  }
  message Redis {
    string address = 1;
    string password = 2;
    int32 database = 3;
  }
  APIServer apiserver = 1;
  MySQL mysql = 2;
  Redis redis = 3;
}

message Logging {
  string format = 1;
  string level = 2;
  bool add_source = 3;
}
