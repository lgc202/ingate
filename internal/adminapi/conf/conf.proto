syntax = "proto3";

package ingate.admin.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lgc202/ingate/internal/adminapi/conf;conf";

// Bootstrap 定义 ingate-admin-api 的完整进程配置
message Bootstrap {
  Server server = 1;
  Data data = 2;
  Logging logging = 3;
  Authentication authentication = 4;
}

message Server {
  message HTTP {
    string addr = 1;
    google.protobuf.Duration timeout = 2;
  }
  HTTP http = 1;
  // shutdown_timeout 是等待在途管理请求结束的最长时间
  google.protobuf.Duration shutdown_timeout = 2;
}

message Data {
  message APIServer {
    string master = 1;
    string kubeconfig = 2;
  }
  APIServer apiserver = 1;
}

message Logging {
  string format = 1;
  string level = 2;
  bool add_source = 3;
}

message Authentication {
  bool enabled = 1;
  string issuer = 2;
  string audience = 3;
  string roles_claim = 4;
  repeated string admin_roles = 5;
  repeated string operator_roles = 6;
  repeated string viewer_roles = 7;
  google.protobuf.Duration discovery_timeout = 8;
  string client_id = 9;
  repeated string scopes = 10;
}
