syntax = "proto3";

package ingate.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// HealthService 提供进程存活检查
service HealthService {
  rpc Check(google.protobuf.Empty) returns (HealthReply) {
    option (google.api.http) = {get: "/healthz"};
  }
}

message HealthReply {
  string status = 1;
  string request_id = 2 [json_name = "requestID"];
}
