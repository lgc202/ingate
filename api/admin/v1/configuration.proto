syntax = "proto3";

package ingate.admin.v1;

import "admin/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// ConfigurationService 提供声明式配置整体生效状态
service ConfigurationService {
  rpc GetConfigurationSummary(google.protobuf.Empty) returns (ConfigurationSummary) {
    option (google.api.http) = {get: "/api/v1/configuration/summary"};
  }
  rpc ListConfigurationItems(ListRequest) returns (ListConfigurationItemsReply) {
    option (google.api.http) = {get: "/api/v1/configuration/items"};
  }
}

message ConfigurationSummary {
  int32 total = 1;
  int32 ready = 2;
  int32 pending = 3;
  int32 error = 4;
  int32 disabled = 5;
}

message ConfigurationItem {
  string kind = 1;
  string id = 2;
  string name = 3;
  ResourceStatus status = 4;
}

message ListConfigurationItemsReply {
  repeated ConfigurationItem items = 1;
  PageInfo page = 2;
}
