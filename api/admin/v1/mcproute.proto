syntax = "proto3";

package admin.v1;

import "admin/v1/gateway.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// MCPRouteService 提供路由管理接口。
service MCPRouteService {
  // CreateMCPRoute 创建路由。
  rpc CreateMCPRoute(CreateMCPRouteRequest) returns (CreateMCPRouteReply) {
    option (google.api.http) = {
      post: "/api/admin/v1/mcp-routes"
      body: "*"
    };
  }

  // GetMCPRoute 读取指定路由。
  rpc GetMCPRoute(GetMCPRouteRequest) returns (GetMCPRouteReply) {
    option (google.api.http) = {get: "/api/admin/v1/mcp-routes/{name}"};
  }

  // ListMCPRoutes 分页列出路由。
  rpc ListMCPRoutes(ListMCPRoutesRequest) returns (ListMCPRoutesReply) {
    option (google.api.http) = {get: "/api/admin/v1/mcp-routes"};
  }

  // UpdateMCPRoute 完整替换路由的可编辑配置。
  rpc UpdateMCPRoute(UpdateMCPRouteRequest) returns (UpdateMCPRouteReply) {
    option (google.api.http) = {
      put: "/api/admin/v1/mcp-routes/{name}"
      body: "*"
    };
  }

  // DeleteMCPRoute 删除指定路由。
  rpc DeleteMCPRoute(DeleteMCPRouteRequest) returns (DeleteMCPRouteReply) {
    option (google.api.http) = {delete: "/api/admin/v1/mcp-routes/{name}"};
  }
}

// CreateMCPRouteRequest 表示创建路由的请求。
message CreateMCPRouteRequest {
  // display_name 是可修改且允许重复的展示名称；技术标识由服务端生成。
  string display_name = 1;
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // path 是入口绝对路径；省略时由 API Server 默认 /mcp，显式空值无效。
  optional string path = 3 [(buf.validate.field).string = {min_len: 1, max_len: 1024}];
  // backend_refs 首版只接受一个网络 Backend。
  repeated MCPBackendReference backend_refs = 4 [(buf.validate.field).repeated = {min_items: 1, max_items: 1}];
}

// CreateMCPRouteReply 表示创建后的路由。
message CreateMCPRouteReply {
  // route 是 API Server 保存后的资源。
  MCPRoute route = 1;
}

// GetMCPRouteRequest 表示读取路由的请求。
message GetMCPRouteRequest {
  // name 是资源的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// GetMCPRouteReply 表示读取到的路由。
message GetMCPRouteReply {
  // route 是 MySQL 查询模型中最近同步的路由。
  MCPRoute route = 1;
}

// ListMCPRoutesRequest 表示分页列出路由的请求。
message ListMCPRoutesRequest {
  // page_size 是单页最大数量；为零时使用服务端默认值。
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
  // page_num 是从 1 开始的页码；为零时使用第一页。
  int32 page_num = 2 [(buf.validate.field).int32.gte = 0];
  // display_name 按展示名称文字包含匹配筛选。
  string display_name = 3;
  // gateway_name 精确筛选声明了指定 Gateway 引用的路由。
  string gateway_name = 4;
}

// ListMCPRoutesReply 表示一页路由。
message ListMCPRoutesReply {
  // routes 是 MySQL 查询模型中当前页的资源。
  repeated MCPRoute routes = 1;
  // total_count 是查询模型中的资源总数。
  int64 total_count = 2;
}

// UpdateMCPRouteRequest 表示完整替换路由的可编辑配置。
message UpdateMCPRouteRequest {
  // name 是资源的稳定名称，不允许通过更新修改。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // version 是读取路由时获得的版本，用于并发更新检查。
  string version = 2 [(buf.validate.field).string.min_len = 1];
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // path 是入口绝对路径；完整 PUT 省略时重置为默认 /mcp。
  optional string path = 4 [(buf.validate.field).string = {min_len: 1, max_len: 1024}];
  // backend_refs 首版只接受一个网络 Backend。
  repeated MCPBackendReference backend_refs = 5 [(buf.validate.field).repeated = {min_items: 1, max_items: 1}];
  // display_name 是可修改且允许重复的展示名称，不改变资源引用。
  string display_name = 6;
}

// UpdateMCPRouteReply 表示更新后的路由。
message UpdateMCPRouteReply {
  // route 是 API Server 保存后的资源。
  MCPRoute route = 1;
}

// DeleteMCPRouteRequest 表示删除路由的请求。
message DeleteMCPRouteRequest {
  // name 是资源的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// DeleteMCPRouteReply 表示 API Server 已接受删除请求。
message DeleteMCPRouteReply {}

// MCPRoute 表示面向产品调用方的路由。
message MCPRoute {
  // name 是资源的稳定名称。
  string name = 1;
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // path 是入口绝对路径。
  optional string path = 3;
  // backend_refs 是单个网络 Backend 的引用及路径。
  repeated MCPBackendReference backend_refs = 4;
  // create_time 是资源的创建时间。
  google.protobuf.Timestamp create_time = 5;
  // version 是更新时必须提交的资源版本。
  string version = 6;
  // display_name 是供人阅读的名称，不用于资源引用。
  string display_name = 7;
}

// MCPBackendReference 引用网络 Backend，并声明上游 MCP 路径。
message MCPBackendReference {
  // name 是 Backend 的稳定名称，不要求引用已存在。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // path 省略时由 API Server 默认 /mcp，显式路径和尾斜杠原样保留。
  optional string path = 2 [(buf.validate.field).string = {min_len: 1, max_len: 1024}];
}
