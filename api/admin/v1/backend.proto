syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// BackendService 提供后端资源管理接口。
service BackendService {
  // CreateBackend 创建后端资源。
  rpc CreateBackend(CreateBackendRequest) returns (CreateBackendReply) {
    option (google.api.http) = {
      post: "/api/admin/v1/namespaces/{namespace}/backends"
      body: "*"
    };
  }

  // GetBackend 读取指定后端资源。
  rpc GetBackend(GetBackendRequest) returns (GetBackendReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/backends/{name}"};
  }

  // ListBackends 分页列出后端资源。
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/backends"};
  }

  // UpdateBackend 完整替换后端资源的可编辑配置。
  rpc UpdateBackend(UpdateBackendRequest) returns (UpdateBackendReply) {
    option (google.api.http) = {
      put: "/api/admin/v1/namespaces/{namespace}/backends/{name}"
      body: "*"
    };
  }

  // DeleteBackend 删除指定后端资源。
  rpc DeleteBackend(DeleteBackendRequest) returns (DeleteBackendReply) {
    option (google.api.http) = {delete: "/api/admin/v1/namespaces/{namespace}/backends/{name}"};
  }
}

// CreateBackendRequest 表示创建后端资源的请求。
message CreateBackendRequest {
  // display_name 是可修改且允许重复的展示名称；技术标识由服务端生成。
  string display_name = 1;
  // endpoints 是后端地址及其相对权重；输入顺序没有业务含义。
  repeated Endpoint endpoints = 2 [(buf.validate.field).repeated.min_items = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// CreateBackendReply 表示创建后的后端资源。
message CreateBackendReply {
  // backend 是 API Server 保存后的资源。
  Backend backend = 1;
}

// GetBackendRequest 表示读取后端资源的请求。
message GetBackendRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// GetBackendReply 表示读取到的后端资源。
message GetBackendReply {
  // backend 是 MySQL 查询模型中最近同步的资源。
  Backend backend = 1;
}

// ListBackendsRequest 表示分页列出后端资源的请求。
message ListBackendsRequest {
  // page_size 是单页最大数量；为零时使用服务端默认值。
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
  // page_num 是从 1 开始的页码；为零时使用第一页。
  int32 page_num = 2 [(buf.validate.field).int32.gte = 0];
  // display_name 按展示名称文字包含匹配筛选。
  string display_name = 3;
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// ListBackendsReply 表示一页后端资源。
message ListBackendsReply {
  // backends 是 MySQL 查询模型中当前页的资源。
  repeated Backend backends = 1;
  // total_count 是查询模型中的资源总数。
  int64 total_count = 2;
}

// UpdateBackendRequest 表示完整替换后端资源的可编辑配置。
message UpdateBackendRequest {
  // name 是资源在所属命名空间内的稳定名称，不允许通过更新修改。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // version 是读取后端资源时获得的版本，用于并发更新检查。
  string version = 2 [(buf.validate.field).string.min_len = 1];
  // endpoints 是后端地址及其相对权重；输入顺序没有业务含义。
  repeated Endpoint endpoints = 3 [(buf.validate.field).repeated.min_items = 1];
  // display_name 是可修改且允许重复的展示名称，不改变资源引用。
  string display_name = 4;
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// UpdateBackendReply 表示更新后的后端资源。
message UpdateBackendReply {
  // backend 是 API Server 保存后的资源。
  Backend backend = 1;
}

// DeleteBackendRequest 表示删除后端资源的请求。
message DeleteBackendRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// DeleteBackendReply 表示 API Server 已接受删除请求。
message DeleteBackendReply {}

// Backend 表示面向产品调用方的后端资源。
message Backend {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1;
  // endpoints 是后端地址及其相对权重，按地址和端口排序返回。
  repeated Endpoint endpoints = 2;
  // create_time 是资源的创建时间。
  google.protobuf.Timestamp create_time = 3;
  // version 是更新时必须提交的资源版本。
  string version = 4;
  // display_name 是供人阅读的名称，不用于资源引用。
  string display_name = 5;
  // namespace 是资源所属的命名空间。
  string namespace = 6;
}

// BackendReference 引用同一命名空间的网络后端。
message BackendReference {
  // name 是 Backend 的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// Endpoint 表示一个后端地址及其相对流量权重。
message Endpoint {
  // address 是不含端口的主机名或 IP 地址。
  string address = 1 [(buf.validate.field).string.min_len = 1];
  // port 是后端服务的监听端口。
  int32 port = 2 [(buf.validate.field).int32 = {gte: 1, lte: 65535}];
  // weight 是该地址的相对流量权重。
  int32 weight = 3 [(buf.validate.field).int32 = {gte: 1}];
}
