syntax = "proto3";

package ingate.admin.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// ResourceState 是声明式资源面向控制台的生效状态
enum ResourceState {
  RESOURCE_STATE_UNSPECIFIED = 0;
  DISABLED = 1;
  PENDING = 2;
  READY = 3;
  ERROR = 4;
}

// ResourceStatus 是控制台展示的声明式资源处理状态
message ResourceStatus {
  ResourceState state = 1;
  string message = 2;
}

// PolicyTargetRef 是创建和更新策略时提交的作用目标
message PolicyTargetRef {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string id = 2 [(buf.validate.field).string.pattern = "\\S"];
}

// PolicyTarget 是控制台展示的策略作用目标及其生效状态
message PolicyTarget {
  string kind = 1;
  string id = 2;
  string display_name = 3;
  ResourceStatus status = 4;
}

// ResourceRequest 通过资源 ID 定位单个管理对象
message ResourceRequest {
  string id = 1 [(buf.validate.field).string.pattern = "\\S"];
}

// SetEnabledRequest 修改资源的启停状态
message SetEnabledRequest {
  string id = 1 [(buf.validate.field).string.pattern = "\\S"];
  optional bool enabled = 2 [(buf.validate.field).required = true];
}

// MutationReply 表示写操作已经完成
message MutationReply {
  bool success = 1;
  string id = 2;
}

// ListRequest 使用 API Server Continue Token 分页读取资源
message ListRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;
}
