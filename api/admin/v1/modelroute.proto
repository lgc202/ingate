syntax = "proto3";

package admin.v1;

import "admin/v1/gateway.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// ModelRouteService 提供路由管理接口。
service ModelRouteService {
  // CreateModelRoute 创建路由。
  rpc CreateModelRoute(CreateModelRouteRequest) returns (CreateModelRouteReply) {
    option (google.api.http) = {
      post: "/api/admin/v1/namespaces/{namespace}/model-routes"
      body: "*"
    };
  }

  // GetModelRoute 读取指定路由。
  rpc GetModelRoute(GetModelRouteRequest) returns (GetModelRouteReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/model-routes/{name}"};
  }

  // ListModelRoutes 分页列出路由。
  rpc ListModelRoutes(ListModelRoutesRequest) returns (ListModelRoutesReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/model-routes"};
  }

  // UpdateModelRoute 完整替换路由的可编辑配置。
  rpc UpdateModelRoute(UpdateModelRouteRequest) returns (UpdateModelRouteReply) {
    option (google.api.http) = {
      put: "/api/admin/v1/namespaces/{namespace}/model-routes/{name}"
      body: "*"
    };
  }

  // DeleteModelRoute 删除指定路由。
  rpc DeleteModelRoute(DeleteModelRouteRequest) returns (DeleteModelRouteReply) {
    option (google.api.http) = {delete: "/api/admin/v1/namespaces/{namespace}/model-routes/{name}"};
  }
}

// CreateModelRouteRequest 表示创建路由的请求。
message CreateModelRouteRequest {
  // display_name 是可修改且允许重复的展示名称；技术标识由服务端生成。
  string display_name = 1;
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // rules 按列表顺序保存规则。
  repeated ModelRouteRule rules = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 15}];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// CreateModelRouteReply 表示创建后的路由。
message CreateModelRouteReply {
  // route 是 API Server 保存后的资源。
  ModelRoute route = 1;
}

// GetModelRouteRequest 表示读取路由的请求。
message GetModelRouteRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// GetModelRouteReply 表示读取到的路由。
message GetModelRouteReply {
  // route 是 MySQL 查询模型中最近同步的路由。
  ModelRoute route = 1;
}

// ListModelRoutesRequest 表示分页列出路由的请求。
message ListModelRoutesRequest {
  // page_size 是单页最大数量；为零时使用服务端默认值。
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
  // page_num 是从 1 开始的页码；为零时使用第一页。
  int32 page_num = 2 [(buf.validate.field).int32.gte = 0];
  // display_name 按展示名称文字包含匹配筛选。
  string display_name = 3;
  // gateway_name 精确筛选声明了指定 Gateway 引用的路由。
  string gateway_name = 4;
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// ListModelRoutesReply 表示一页路由。
message ListModelRoutesReply {
  // routes 是 MySQL 查询模型中当前页的资源。
  repeated ModelRoute routes = 1;
  // total_count 是查询模型中的资源总数。
  int64 total_count = 2;
}

// UpdateModelRouteRequest 表示完整替换路由的可编辑配置。
message UpdateModelRouteRequest {
  // name 是资源在所属命名空间内的稳定名称，不允许通过更新修改。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // version 是读取路由时获得的版本，用于并发更新检查。
  string version = 2 [(buf.validate.field).string.min_len = 1];
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // rules 按列表顺序保存规则。
  repeated ModelRouteRule rules = 4 [(buf.validate.field).repeated = {min_items: 1, max_items: 15}];
  // display_name 是可修改且允许重复的展示名称，不改变资源引用。
  string display_name = 5;
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// UpdateModelRouteReply 表示更新后的路由。
message UpdateModelRouteReply {
  // route 是 API Server 保存后的资源。
  ModelRoute route = 1;
}

// DeleteModelRouteRequest 表示删除路由的请求。
message DeleteModelRouteRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// DeleteModelRouteReply 表示 API Server 已接受删除请求。
message DeleteModelRouteReply {}

// ModelRoute 表示面向产品调用方的路由。
message ModelRoute {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1;
  // parent_refs 引用入口及可选 Listener。
  repeated ParentReference parent_refs = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 16}];
  // rules 按列表顺序保存规则。
  repeated ModelRouteRule rules = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 15}];
  // create_time 是资源的创建时间。
  google.protobuf.Timestamp create_time = 4;
  // version 是更新时必须提交的资源版本。
  string version = 5;
  // display_name 是供人阅读的名称，不用于资源引用。
  string display_name = 6;
  // namespace 是资源所属的命名空间。
  string namespace = 7;
}

// ModelRouteRule 保存有序模型规则，不包含操作路径或 API 格式。
message ModelRouteRule {
  // name 可选且不参与排序。
  string name = 1;
  // matches 之间为 OR；省略或空值表示所有模型。
  repeated ModelRouteMatch matches = 2 [(buf.validate.field).repeated.max_items = 128];
  // backend_refs 首版只接受一个 AIBackend。
  repeated AIBackendReference backend_refs = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 1}];
}

// ModelRouteMatch 保存 AND 关系的 Header 条件；空 match 表示所有模型。
message ModelRouteMatch {
  // headers 首版至多一个模型 Header 条件。
  repeated HTTPHeaderMatch headers = 1 [(buf.validate.field).repeated.max_items = 1];
}

// HTTPHeaderMatch 声明网关提取的模型名称条件，不声明客户端 Header 的可信性。
message HTTPHeaderMatch {
  // name 首版只接受大小写不敏感的 x-ai-eg-model。
  string name = 1 [(buf.validate.field).string.pattern = "(?i)^x-ai-eg-model$"];
  // type 省略或为空时由 API Server 默认 Exact，不支持正则。
  string type = 2 [(buf.validate.field).string = {in: ["", "Exact"]}];
  // value 原样匹配模型名称，不删除空白或改写大小写。
  string value = 3 [(buf.validate.field).string.min_len = 1];
}

// AIBackendReference 引用同一命名空间的模型服务，并可覆盖出站模型名称。
message AIBackendReference {
  // name 是 AIBackend 的稳定名称，不要求引用已存在。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // model_name_override 省略或为空时保留请求模型名称。
  string model_name_override = 2;
}
