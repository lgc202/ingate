syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// RouteService 提供路由管理接口。
service RouteService {
  // CreateRoute 创建路由。
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteReply) {
    option (google.api.http) = {
      post: "/api/admin/v1/routes"
      body: "*"
    };
  }

  // GetRoute 读取指定路由。
  rpc GetRoute(GetRouteRequest) returns (GetRouteReply) {
    option (google.api.http) = {get: "/api/admin/v1/routes/{name}"};
  }

  // ListRoutes 分页列出路由。
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesReply) {
    option (google.api.http) = {get: "/api/admin/v1/routes"};
  }

  // UpdateRoute 完整替换路由的可编辑配置。
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteReply) {
    option (google.api.http) = {
      put: "/api/admin/v1/routes/{name}"
      body: "*"
    };
  }

  // DeleteRoute 删除指定路由。
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteReply) {
    option (google.api.http) = {delete: "/api/admin/v1/routes/{name}"};
  }
}

// CreateRouteRequest 表示创建路由的请求。
message CreateRouteRequest {
  // name 是资源的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // gateway_name 是路由所属的网关。
  string gateway_name = 2 [(buf.validate.field).string.min_len = 1];
  // listener_name 是网关内的监听入口。
  string listener_name = 3 [(buf.validate.field).string.min_len = 1];
  // path 是请求路径的匹配条件。
  PathMatch path = 4 [(buf.validate.field).required = true];
  // upstream_name 是接收请求的后端资源。
  string upstream_name = 5 [(buf.validate.field).string.min_len = 1];
}

// CreateRouteReply 表示创建后的路由。
message CreateRouteReply {
  // route 是 API Server 保存后的资源。
  Route route = 1;
}

// GetRouteRequest 表示读取路由的请求。
message GetRouteRequest {
  // name 是资源的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// GetRouteReply 表示读取到的路由。
message GetRouteReply {
  // route 是 MySQL 查询模型中最近同步的路由。
  Route route = 1;
}

// ListRoutesRequest 表示分页列出路由的请求。
message ListRoutesRequest {
  // page_size 是单页最大数量；为零时使用服务端默认值。
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
  // page_num 是从 1 开始的页码；为零时使用第一页。
  int32 page_num = 2 [(buf.validate.field).int32.gte = 0];
}

// ListRoutesReply 表示一页路由。
message ListRoutesReply {
  // routes 是 MySQL 查询模型中当前页的资源。
  repeated Route routes = 1;
  // total_count 是查询模型中的资源总数。
  int64 total_count = 2;
}

// UpdateRouteRequest 表示完整替换路由的可编辑配置。
message UpdateRouteRequest {
  // name 是资源的稳定名称，不允许通过更新修改。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // version 是读取路由时获得的版本，用于并发更新检查。
  string version = 2 [(buf.validate.field).string.min_len = 1];
  // gateway_name 是路由所属的网关。
  string gateway_name = 3 [(buf.validate.field).string.min_len = 1];
  // listener_name 是网关内的监听入口。
  string listener_name = 4 [(buf.validate.field).string.min_len = 1];
  // path 是请求路径的匹配条件。
  PathMatch path = 5 [(buf.validate.field).required = true];
  // upstream_name 是接收请求的后端资源。
  string upstream_name = 6 [(buf.validate.field).string.min_len = 1];
}

// UpdateRouteReply 表示更新后的路由。
message UpdateRouteReply {
  // route 是 API Server 保存后的资源。
  Route route = 1;
}

// DeleteRouteRequest 表示删除路由的请求。
message DeleteRouteRequest {
  // name 是资源的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// DeleteRouteReply 表示 API Server 已接受删除请求。
message DeleteRouteReply {}

// Route 表示面向产品调用方的路由。
message Route {
  // name 是资源的稳定名称。
  string name = 1;
  // gateway_name 是路由所属的网关。
  string gateway_name = 2;
  // listener_name 是网关内的监听入口。
  string listener_name = 3;
  // path 是请求路径的匹配条件。
  PathMatch path = 4;
  // upstream_name 是接收请求的后端资源。
  string upstream_name = 5;
  // create_time 是资源的创建时间。
  google.protobuf.Timestamp create_time = 6;
  // version 是更新时必须提交的资源版本。
  string version = 7;
}

// PathMatch 表示请求路径的匹配方式和值。
message PathMatch {
  // type 选择完整路径或路径前缀匹配。
  PathMatchType type = 1;
  // value 是不含查询参数和片段的绝对路径。
  string value = 2 [(buf.validate.field).string.min_len = 1];
}

// PathMatchType 表示请求路径的匹配方式。
enum PathMatchType {
  // PATH_MATCH_TYPE_UNSPECIFIED 表示未指定匹配方式。
  PATH_MATCH_TYPE_UNSPECIFIED = 0;
  // PATH_MATCH_TYPE_EXACT 表示完整路径匹配。
  PATH_MATCH_TYPE_EXACT = 1;
  // PATH_MATCH_TYPE_PREFIX 表示按路径段匹配前缀。
  PATH_MATCH_TYPE_PREFIX = 2;
}
