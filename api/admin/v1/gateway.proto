syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// GatewayService 提供面向产品调用方的网关管理接口。
service GatewayService {
  // CreateGateway 创建一个 Gateway。
  rpc CreateGateway(CreateGatewayRequest) returns (CreateGatewayReply) {
    option (google.api.http) = {
      post: "/api/admin/v1/namespaces/{namespace}/gateways"
      body: "*"
    };
  }

  // GetGateway 读取指定网关。
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/gateways/{name}"};
  }

  // ListGateways 分页列出网关。
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysReply) {
    option (google.api.http) = {get: "/api/admin/v1/namespaces/{namespace}/gateways"};
  }

  // UpdateGateway 完整替换网关的可编辑配置。
  rpc UpdateGateway(UpdateGatewayRequest) returns (UpdateGatewayReply) {
    option (google.api.http) = {
      put: "/api/admin/v1/namespaces/{namespace}/gateways/{name}"
      body: "*"
    };
  }

  // DeleteGateway 删除指定网关。
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayReply) {
    option (google.api.http) = {delete: "/api/admin/v1/namespaces/{namespace}/gateways/{name}"};
  }
}

// CreateGatewayRequest 表示创建网关的请求。
message CreateGatewayRequest {
  reserved 1;
  reserved "name";
  // display_name 是供人阅读的名称，不参与资源引用或流量匹配。
  string display_name = 2;
  // listeners 是网关对外暴露的监听入口。
  repeated Listener listeners = 3 [(buf.validate.field).repeated.min_items = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// CreateGatewayReply 表示创建网关的结果。
message CreateGatewayReply {
  // gateway 是 API Server 保存后的资源。
  Gateway gateway = 1;
}

// GetGatewayRequest 表示读取网关的请求。
message GetGatewayRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// GetGatewayReply 表示读取到的网关。
message GetGatewayReply {
  // gateway 是 MySQL 查询模型中最近同步的网关。
  Gateway gateway = 1;
}

// ListGatewaysRequest 表示分页列出网关的请求。
message ListGatewaysRequest {
  // page_size 是单页最大数量；为零时使用服务端默认值。
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}];
  // page_num 是从 1 开始的页码；为零时使用第一页。
  int32 page_num = 2 [(buf.validate.field).int32.gte = 0];
  // display_name 按展示名称文字包含匹配筛选，空值表示不筛选。
  string display_name = 3;
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// ListGatewaysReply 表示一页网关。
message ListGatewaysReply {
  // gateways 是 MySQL 查询模型中当前页的资源。
  repeated Gateway gateways = 1;
  // total_count 是查询模型中的资源总数。
  int64 total_count = 2;
}

// UpdateGatewayRequest 表示完整替换网关的可编辑配置。
message UpdateGatewayRequest {
  // name 是资源在所属命名空间内的稳定名称，不允许通过更新修改。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // version 是读取网关时获得的版本，用于并发更新检查。
  string version = 2 [(buf.validate.field).string.min_len = 1];
  // display_name 是供人阅读的名称。
  string display_name = 3;
  // listeners 是网关对外暴露的监听入口。
  repeated Listener listeners = 4 [(buf.validate.field).repeated.min_items = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// UpdateGatewayReply 表示更新后的网关。
message UpdateGatewayReply {
  // gateway 是 API Server 保存后的资源。
  Gateway gateway = 1;
}

// DeleteGatewayRequest 表示删除网关的请求。
message DeleteGatewayRequest {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // namespace 是本次操作的目标命名空间，必须显式指定。
  string namespace = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// DeleteGatewayReply 表示 API Server 已接受删除请求。
message DeleteGatewayReply {}

// Gateway 表示面向产品调用方的网关。
message Gateway {
  // name 是资源在所属命名空间内的稳定名称。
  string name = 1;
  // display_name 是供人阅读的名称。
  string display_name = 2;
  // listeners 是网关对外暴露的监听入口。
  repeated Listener listeners = 3;
  // create_time 是资源的创建时间。
  google.protobuf.Timestamp create_time = 4;
  // version 是更新时必须提交的资源版本。
  string version = 5;
  // namespace 是资源所属的命名空间。
  string namespace = 6;
}

// ParentReference 引用同一命名空间的 Gateway 及可选 Listener。
message ParentReference {
  // name 是 Gateway 的稳定名称。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // section_name 省略时选择所有受支持的 HTTP Listener。
  string section_name = 2;
}

// Listener 表示网关对外暴露的一个监听入口。
message Listener {
  // name 是当前 Gateway 内稳定且唯一的 Listener 名称。
  string name = 1 [(buf.validate.field).string = {
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];
  // protocol 是监听入口处理的应用层协议。
  ListenerProtocol protocol = 2 [(buf.validate.field).enum.const = 1];
  // port 是数据面对外监听的端口。
  int32 port = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];
  // hostname 限制 Listener 接受的 Host；为空时接受任意 Host。
  string hostname = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 253
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
    }
  ];
}

// ListenerProtocol 表示 Listener 处理的应用层协议。
enum ListenerProtocol {
  // LISTENER_PROTOCOL_UNSPECIFIED 表示未指定协议。
  LISTENER_PROTOCOL_UNSPECIFIED = 0;
  // LISTENER_PROTOCOL_HTTP 表示明文 HTTP 流量。
  LISTENER_PROTOCOL_HTTP = 1;
}
