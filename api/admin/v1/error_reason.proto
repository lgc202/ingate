syntax = "proto3";

package ingate.admin.v1;

option go_package = "github.com/lgc202/ingate/api/admin/v1;v1";

// ErrorReason 定义 Admin API 对日志和调用方稳定的错误语义
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  INVALID_ARGUMENT = 1;
  BUSINESS_RULE_VIOLATION = 2;
  INTERNAL_ERROR = 3;
  ROUTE_NOT_FOUND = 4;
  METHOD_NOT_ALLOWED = 5;
  PANIC = 6;
  UNAUTHENTICATED = 7;
  PERMISSION_DENIED = 8;
  RESOURCE_VERSION_CONFLICT = 9;
  RESOURCE_NOT_FOUND = 10;
}
