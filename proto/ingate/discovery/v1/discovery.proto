syntax = "proto3";

package ingate.discovery.v1;

option go_package = "github.com/lgc202/ingate/pkg/generated/proto/ingate/discovery/v1;discoveryv1";

message ResolveRequest {
  string backend_name = 1;
  string backend_type = 2;
  string address = 3;
  uint32 port = 4;
}

message ResolveResponse {
  repeated Endpoint endpoints = 1;
}

message Endpoint {
  string address = 1;
  uint32 port = 2;
  uint32 weight = 3;
  bool healthy = 4;
}

service DiscoveryService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}
