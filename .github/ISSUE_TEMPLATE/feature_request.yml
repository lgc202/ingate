name: 功能建议
description: 提出有明确使用场景的新能力或改进建议
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        Ingate 优先解决真实网关场景。请先说明遇到的问题，再描述期望方案。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: 期望行为
      description: 描述用户操作、配置方式和可验收结果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前如何绕过问题，以及替代方案为什么不够

  - type: textarea
    id: references
    attributes:
      label: 参考实现
      description: 可以附上其他网关、标准或实际项目的相关链接

  - type: checkboxes
    id: scope
    attributes:
      label: 提交前确认
      options:
        - label: 这项建议属于 API 或 AI 网关的流量管理、治理、扩展或观测能力
          required: true
        - label: 我已经搜索现有 Issue，未发现相同建议
          required: true
