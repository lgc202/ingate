name: 缺陷报告
description: 报告可复现的功能异常或运行问题
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Ingate。请删除日志和配置中的密码、访问密钥、证书私钥及其他敏感信息。

  - type: input
    id: version
    attributes:
      label: Ingate 版本
      description: 填写 Release 版本或 Git commit
      placeholder: v0.1.3
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: 运行方式
      options:
        - Docker Compose Release
        - 源码开发环境
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、CPU 架构、Docker 和 Docker Compose 版本
      placeholder: |
        OS: Ubuntu 24.04
        Arch: amd64
        Docker: 28.x
        Docker Compose: v2.x
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供可以稳定重现问题的最小操作步骤
      placeholder: |
        1. 创建……
        2. 配置……
        3. 发送请求……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 提供相关日志、请求响应或截图；请先移除敏感信息

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索现有 Issue，未发现相同问题
          required: true
        - label: 我已经移除密码、访问密钥、证书私钥和其他敏感信息
          required: true
