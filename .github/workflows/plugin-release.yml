name: Plugin release

run-name: Release ${{ inputs.plugin }} v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - transformer
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # 官方目录同时只接受一个插件版本发布，避免目录版本竞争
  group: plugin-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      plugin: ${{ steps.metadata.outputs.plugin }}
      package: ${{ steps.metadata.outputs.package }}
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve plugin metadata
        id: metadata
        env:
          PLUGIN: ${{ inputs.plugin }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $RELEASE_VERSION" >&2
            exit 1
          fi
          metadata="plugins/${PLUGIN}/plugin.json"
          jq -e '
            .package != null and .package != "" and
            .name != null and .name != "" and
            .minIngateVersion != null and .minIngateVersion != "" and
            .artifactRepository != null and .artifactRepository != ""
          ' "$metadata" >/dev/null
          package=$(jq -r '.package' "$metadata")
          image=$(jq -r '.artifactRepository' "$metadata")
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Verify commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build plugin
        env:
          PLUGIN: ${{ steps.metadata.outputs.plugin }}
        run: |
          mkdir -p _output/plugins
          GOOS=wasip1 GOARCH=wasm go build -trimpath -buildmode=c-shared \
            -o "_output/plugins/${PLUGIN}.wasm" "./plugins/${PLUGIN}"

  publish:
    name: Publish plugin
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest || steps.artifact.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 已发布版本不允许覆盖；若上次在更新目录前失败，重跑工作流会复用原制品完成目录发布
      - name: Resolve plugin artifact
        id: artifact
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          inspect=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>/dev/null || true)
          digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect")
          if [[ -n "$digest" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push plugin image
        id: publish
        if: steps.artifact.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/wasm-plugin.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          build-args: |
            PLUGIN=${{ needs.verify.outputs.plugin }}
          cache-from: type=gha,scope=plugin-${{ needs.verify.outputs.plugin }}
          cache-to: type=gha,mode=max,scope=plugin-${{ needs.verify.outputs.plugin }}

  catalog:
    name: Build published catalog
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 线上目录是发布产物而不是源码；新版本在已有目录上追加，代码仓库无需维护版本清单
      - name: Download published catalog
        env:
          CATALOG_URL: https://lgc202.github.io/ingate/plugins/v1/catalog.json
        run: |
          output="_catalog/plugins/v1/catalog.json"
          mkdir -p "$(dirname "$output")"
          status=$(curl --silent --show-error --location "$CATALOG_URL" --output "$output" --write-out '%{http_code}')
          case "$status" in
            200) ;;
            404) printf '{"plugins":[]}\n' > "$output" ;;
            *) echo "Download plugin catalog failed with HTTP status $status" >&2; exit 1 ;;
          esac

      - name: Build published catalog
        env:
          PLUGIN: ${{ needs.verify.outputs.plugin }}
          PLUGIN_PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          version="${VERSION#v}"
          digest="${DIGEST#sha256:}"
          metadata="plugins/${PLUGIN}/plugin.json"
          output="_catalog/plugins/v1/catalog.json"

          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid OCI manifest digest: $DIGEST" >&2
            exit 1
          fi

          next="${output}.next"
          jq \
            --arg package "$PLUGIN_PACKAGE" \
            --arg version "$version" \
            --arg digest "$digest" \
            --slurpfile metadata "$metadata" '
            . as $catalog |
            $metadata[0] as $definition |
            ([ $catalog.plugins[]? | select(.package == $package) ][0].releases // []) as $releases |
            ($definition | {
              package,
              name,
              category,
              description,
              provider,
              license,
              sourceUrl,
              releases: ([ $releases[] | select(.version != $version) ] + [{
                version: $version,
                minIngateVersion,
                artifact: {
                  repository: .artifactRepository,
                  sha256: $digest
                }
              }])
            }) as $plugin |
            {
              plugins: ([ $catalog.plugins[]? | select(.package != $package) ] + [$plugin])
            }
          ' "$output" > "$next"
          mv "$next" "$output"

      # 目录是统一项目站点的输入之一，插件工作流不能单独覆盖 Pages
      - name: Upload published catalog
        uses: actions/upload-artifact@v6
        with:
          name: plugin-catalog
          path: _catalog
          if-no-files-found: error
          retention-days: 1

  publish-site:
    name: Publish project site
    needs: catalog
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      catalog_artifact: plugin-catalog
