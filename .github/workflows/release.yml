name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$RELEASE_INPUT"
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from the main branch" >&2
              exit 1
            fi
          else
            version="$GITHUB_REF_NAME"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          git fetch origin main --tags
          commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          git merge-base --is-ancestor "$commit" origin/main

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$commit" != "$(git rev-parse origin/main)" ]]; then
              echo "Manual releases must use the latest commit on main" >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$version"; then
              echo "Release tag already exists: $version" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/console/package-lock.json
            web/prototype/package-lock.json

      - name: Verify
        run: make verify

  images:
    name: Publish ${{ matrix.component }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - apiserver
          - controller
          - admin-api
          - assistant
          - console
          - als
          - analytics
          - ai-extproc
          - authz
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Resolve build metadata
        id: metadata
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: echo "build_date=$(git show -s --format=%cI "$RELEASE_COMMIT")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/ingate.Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lgc202/ingate-${{ matrix.component }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          build-args: |
            COMPONENT=${{ matrix.component }}
            GIT_VERSION=${{ needs.verify.outputs.version }}
            GIT_COMMIT=${{ needs.verify.outputs.commit }}
            GIT_TREE_STATE=clean
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  release:
    name: Publish GitHub release
    needs:
      - verify
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Package Docker Compose distribution
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: ./scripts/package-compose.sh "$RELEASE_VERSION" dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          options=(
            "$RELEASE_VERSION"
            dist/ingate-compose.tar.gz
            dist/ingate-compose.tar.gz.sha256
            scripts/install.sh
            --generate-notes
            --title "$RELEASE_VERSION"
          )
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            options+=(--target "$RELEASE_COMMIT")
          else
            options+=(--verify-tag)
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "${options[@]}"
