name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Go checks
        run: |
          unformatted=$(gofmt -l api cmd internal pkg)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test ./...
          go build ./...
      - name: Generated API
        run: |
          bash scripts/generate-api.sh
          git diff --exit-code -- pkg/apis pkg/generated
          test -z "$(git ls-files --others --exclude-standard pkg/apis pkg/generated)"
      - name: Protobuf contract and generated code
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.73.0 lint
          go run github.com/bufbuild/buf/cmd/buf@v1.73.0 generate
          git diff --exit-code -- api/admin internal/adminapi/conf
          test -z "$(git ls-files --others --exclude-standard api/admin internal/adminapi/conf)"
