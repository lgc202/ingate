name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      catalog_artifact:
        description: Plugin catalog artifact produced by a release workflow
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  # 文档与插件发布共用一个项目站点，必须串行部署完整站点制品
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build project site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run build --prefix docs

      # 插件发布传入刚生成的目录；普通文档发布沿用线上目录，不能把已发布插件回退成内置快照
      - name: Download released plugin catalog
        if: inputs.catalog_artifact != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.catalog_artifact }}
          path: _catalog

      - name: Preserve published plugin catalog
        if: inputs.catalog_artifact == ''
        env:
          CATALOG_URL: https://lgc202.github.io/ingate/plugins/v1/catalog.json
        run: |
          output="_catalog/plugins/v1/catalog.json"
          mkdir -p "$(dirname "$output")"
          status=$(curl --silent --show-error --location "$CATALOG_URL" --output "$output" --write-out '%{http_code}')
          case "$status" in
            200) ;;
            404) printf '{"plugins":[]}\n' > "$output" ;;
            *) echo "Download plugin catalog failed with HTTP status $status" >&2; exit 1 ;;
          esac

      - name: Assemble project site
        run: |
          mkdir -p _publish
          cp -R docs/dist/. _publish/
          # 文档本身已有 /plugins 页面，只复制目录内容，避免生成 /plugins/plugins
          mkdir -p _publish/plugins
          cp -R _catalog/plugins/. _publish/plugins/
          test -f _publish/plugins/v1/catalog.json
          test ! -e _publish/plugins/plugins

      - name: Upload project site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _publish

  deploy:
    name: Deploy project site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
