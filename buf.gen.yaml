version: v2

inputs:
  - directory: api
  - directory: internal

plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    out: .
    opt: module=github.com/lgc202/ingate
  - local:
      - go
      - run
      - google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
    out: .
    opt: module=github.com/lgc202/ingate
  - local:
      - go
      - run
      - github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260526000039-30da04b769dc
    out: .
    opt: module=github.com/lgc202/ingate
